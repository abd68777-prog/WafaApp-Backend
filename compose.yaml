# Local backend for frontend development: `docker compose up --build -d`,
# then the API is at http://localhost:8000. See README → "Running with Docker".
#
# Secrets and per-developer values are read from a `.env` file next to this
# one (copy .env.example). Everything else has a working default below.

name: loyalty-cards

services:
  app: &app
    build:
      context: .
      target: app
    # Every value comes from the .env next to this file; inside the container
    # Laravel reads only what is listed here. The defaults are the safe ones
    # (production, no debug), so a developer's .env sets APP_ENV=local and
    # APP_DEBUG=true, and a server sets its own passwords and Cloudinary disks.
    environment:
      APP_NAME: ${APP_NAME:-Loyalty Cards API}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:${API_PORT:-8000}}
      # OTP codes and errors go to `docker compose logs app`.
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-loyalty_cards}
      DB_USERNAME: ${DB_USERNAME:-loyalty}
      DB_PASSWORD: ${DB_PASSWORD:-loyalty}
      SESSION_DRIVER: array
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      OTP_DRIVER: ${OTP_DRIVER:-log}
      LIGHTOTP_API_KEY: ${LIGHTOTP_API_KEY:-}
      # Web origins of the admin dashboard and Expo web; native apps need no CORS.
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:3000,http://localhost:5173,http://localhost:8081}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:3000}
      # Only for `php artisan clerk:smoke-test`; no request uses it.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      REVIEW_PHONE: ${REVIEW_PHONE:-}
      REVIEW_OTP_CODE: ${REVIEW_OTP_CODE:-}
      ADMIN_NAME: ${ADMIN_NAME:-Platform Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_CLERK_USER_ID: ${ADMIN_CLERK_USER_ID:-}
      CUSTOMER_TOKEN_IDLE_DAYS: ${CUSTOMER_TOKEN_IDLE_DAYS:-90}
      # Push notifications: the Firebase service account JSON, placed in
      # ./secrets (never committed). Empty = notifications stay in the inbox.
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      # Shop logos and payment proofs: local disks, or "cloudinary" for both
      # with CLOUDINARY_URL=cloudinary://<api_key>:<api_secret>@<cloud_name>.
      MEDIA_DISK: ${MEDIA_DISK:-public}
      PROOFS_DISK: ${PROOFS_DISK:-local}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
    volumes:
      # Keeps the generated app key, logs and uploads across rebuilds.
      - storage:/var/www/html/storage
      - ./secrets:/var/www/html/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Sends push notifications from the queue.
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    depends_on:
      - app

  # Scheduled jobs: subscription statuses (hourly), the merchants' birthday
  # reminder and idle-token cleanup.
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - app

  web:
    build:
      context: .
      target: web
    # Reachable from this machine only: on a server the reverse proxy (Caddy)
    # in front of it is the one way in, over HTTPS. Set API_BIND=0.0.0.0 to
    # reach a local backend from a phone on the same network.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:80"
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.4
    # Read only when the volume is first created: on an existing database,
    # change the passwords with ALTER USER, then here through .env.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-loyalty_cards}
      MYSQL_USER: ${DB_USERNAME:-loyalty}
      MYSQL_PASSWORD: ${DB_PASSWORD:-loyalty}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  db-data:
  storage:
