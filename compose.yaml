# Local backend for frontend development: `docker compose up --build -d`,
# then the API is at http://localhost:8000. See README → "Running with Docker".
#
# Secrets and per-developer values are read from a `.env` file next to this
# one (copy .env.example). Everything else has a working default below.

name: loyalty-cards

services:
  app:
    build:
      context: .
      target: app
    environment:
      APP_NAME: "Loyalty Cards API"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${API_PORT:-8000}
      # OTP codes and errors go to `docker compose logs app`.
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: loyalty_cards
      DB_USERNAME: loyalty
      DB_PASSWORD: loyalty
      SESSION_DRIVER: array
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      OTP_DRIVER: ${OTP_DRIVER:-log}
      LIGHTOTP_API_KEY: ${LIGHTOTP_API_KEY:-}
      # Web origins of the admin dashboard and Expo web; native apps need no CORS.
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:3000,http://localhost:5173,http://localhost:8081}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:3000}
      ADMIN_NAME: ${ADMIN_NAME:-Platform Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_CLERK_USER_ID: ${ADMIN_CLERK_USER_ID:-}
    volumes:
      # Keeps the generated app key, logs and uploads across rebuilds.
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "${API_PORT:-8000}:80"
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: loyalty_cards
      MYSQL_USER: loyalty
      MYSQL_PASSWORD: loyalty
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  db-data:
  storage:
