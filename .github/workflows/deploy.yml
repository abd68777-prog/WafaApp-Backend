name: Deploy to HardBrain VPS

# Pull requests run the tests only.
# A push to develop: tests, then deploys to staging.
# A push to main:    tests, then waits for approval, then deploys to production.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests
        run: php artisan test --compact

  deploy:
    needs: test
    # Only main and develop ever deploy; any other branch stops after the tests.
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The "production" environment holds the manual approval rule.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    # One deploy per branch at a time, and never cut short halfway.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Pick the target
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "dir=/opt/wafa-app"        >> "$GITHUB_OUTPUT"
            echo "project=loyalty-cards"    >> "$GITHUB_OUTPUT"
            echo "port=8000"                >> "$GITHUB_OUTPUT"
          else
            echo "dir=/opt/wafa-staging"    >> "$GITHUB_OUTPUT"
            echo "project=wafa-staging"     >> "$GITHUB_OUTPUT"
            echo "port=8001"                >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            DIR="${{ steps.target.outputs.dir }}"
            PROJECT="${{ steps.target.outputs.project }}"
            PORT="${{ steps.target.outputs.port }}"
            BRANCH="${{ github.ref_name }}"

            echo "Deploying $BRANCH to $DIR (project $PROJECT, port $PORT)"
            cd "$DIR"
            git fetch --depth 1 origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            # -p is explicit so staging can never touch the production containers.
            # Migrations run in the app entrypoint (migrate --force).
            docker compose -p "$PROJECT" up --build -d --remove-orphans
            # Recreate the app containers so they never keep running an old image.
            docker compose -p "$PROJECT" up -d --no-deps --force-recreate app worker scheduler web
            docker compose -p "$PROJECT" ps

            # The deploy fails unless the API answers within a minute.
            for attempt in $(seq 1 20); do
              if curl -sf "http://127.0.0.1:$PORT/api/v1/ping" > /dev/null; then
                echo "Deploy OK (API answered on attempt $attempt)"
                exit 0
              fi
              sleep 3
            done
            echo "The API did not answer after the deploy." >&2
            docker compose -p "$PROJECT" logs --tail 50 app web >&2
            exit 1

  notify:
    needs: [test, deploy]
    if: always() && github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    steps:
      - name: Send a Telegram message
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets are not set; skipping the notification."
            exit 0
          fi

          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS="✅ Deployed"
          elif [ "$TEST_RESULT" != "success" ]; then
            STATUS="❌ Tests failed, nothing was deployed"
          elif [ "$DEPLOY_RESULT" = "cancelled" ]; then
            STATUS="⚪ Deploy cancelled or not approved"
          else
            STATUS="❌ Deploy failed"
          fi

          FIRST_LINE="${COMMIT_MSG%%$'\n'*}"
          TEXT="Wafa API — ${TARGET}
          ${STATUS}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA::7} ${FIRST_LINE}
          By: ${GITHUB_ACTOR}
          ${RUN_URL}"
          TEXT="$(printf '%s\n' "$TEXT" | sed 's/^[[:space:]]*//')"

          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" > /dev/null
