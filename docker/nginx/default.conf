server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Room for payment proof and logo uploads.
    client_max_body_size 20m;

    # Say nothing about the software versions behind the API.
    server_tokens off;
    fastcgi_hide_header X-Powered-By;

    # A JSON API: no sniffing a response into something else, no framing,
    # no referrer leaking to other sites. HSTS is set by Caddy in front.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
