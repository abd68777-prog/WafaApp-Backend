  /admin/settings/app:
    get:
      tags: [الإدارة — الباقات والإعدادات]
      operationId: adminGetAppSettings
      summary: باقي الإعدادات
      description: الطوابع، والحملات، وإصدارات تطبيق التاجر، والروابط، وجلسة الـPIN. الصلاحية `manage-settings` (Super Admin).
      security: [{ clerkSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/AppSettingsData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [الإدارة — الباقات والإعدادات]
      operationId: adminUpdateAppSettings
      summary: تعديل الإعدادات
      description: |
        ابعت الحقول يلي بدك تغيّرها بس. `card_stamps_min` ما بيتجاوز `card_stamps_max` حتى لو بعتت وحدة بس (`invalid`).
        بتنكتب بسجل التدقيق.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stamp_interval_minutes: { type: integer, minimum: 0, maximum: 1440 }
                card_stamps_min: { type: integer, minimum: 1, maximum: 50 }
                card_stamps_max: { type: integer, minimum: 1, maximum: 50 }
                qr_period_seconds: { type: integer, minimum: 15, maximum: 600 }
                campaign_title_max: { type: integer, minimum: 10, maximum: 255 }
                campaign_body_max: { type: integer, minimum: 20, maximum: 2000 }
                merchant_min_app_version: { type: [string, 'null'], pattern: '^\d+\.\d+\.\d+$' }
                merchant_app_download_url: { type: [string, 'null'], format: uri, maxLength: 500 }
                privacy_policy_url: { type: [string, 'null'], format: uri, maxLength: 500 }
                customer_terms_url: { type: [string, 'null'], format: uri, maxLength: 500 }
                merchant_terms_url: { type: [string, 'null'], format: uri, maxLength: 500 }
                pin_unlock_hours: { type: integer, minimum: 1, maximum: 72 }
      responses:
        '200': { $ref: '#/components/responses/AppSettingsData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/audit-logs:
    get:
      tags: [الإدارة — سجل التدقيق]
      operationId: adminListAuditLogs
      summary: سجل التدقيق
      description: الأحدث أول. الصلاحية `view-audit-log` (Super Admin). `subject_id` بدون `subject_type` بيرجع `422`.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 64, example: merchant.suspended } }
        - { name: admin_user_id, in: query, required: false, schema: { type: integer } }
        - { name: subject_type, in: query, required: false, schema: { type: string, enum: [merchant, customer, payment, stamp, card, package, admin] } }
        - { name: subject_id, in: query, required: false, schema: { type: integer } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحة من السجل
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLogEntry' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ─────────────────────────── للخادم فقط ───────────────────────────
  /webhooks/clerk:
    post:
      tags: [للخادم فقط]
      operationId: clerkWebhook
      summary: أحداث Clerk
      description: |
        **التطبيقات ما بتستعمله.** موقّع بتوقيع Svix.
        `user.updated`: البريد الأساسي الجديد بيتحدّث للتاجر ولحساب الإدارة المربوط.
        `user.deleted`: حساب الإدارة بينفك ربطه، وبيانات التاجر ما بتنلمس (بس سطر بسجل التدقيق).
      security: []
      parameters:
        - { name: svix-id, in: header, required: true, schema: { type: string } }
        - { name: svix-timestamp, in: header, required: true, schema: { type: string } }
        - { name: svix-signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: { type: string, examples: [user.updated, user.deleted] }
                data: { type: object }
      responses:
        '200': { description: انستلم أي حدث موقّع }
        '400': { description: توقيع غلط أو أقدم من 5 دقائق }

components:
  securitySchemes:
    customerToken:
      type: http
      scheme: bearer
      description: |
        توكن الزبون من `POST /customer/auth/verify`. خزّنه بـ`expo-secure-store`.
        ما إلو مدة ثابتة، بس بيوقف إذا ما انستعمل 90 يوم (`CUSTOMER_TOKEN_IDLE_DAYS`)، وكل طلب بيجدّد العداد.
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: توكن جلسة Clerk من `getToken()` **قبل كل طلب**، وما بيتخزّن. للتاجر ولوحة الإدارة.
    pinToken:
      type: apiKey
      in: header
      name: X-Pin-Token
      description: '`pin_token` من `POST /merchant/pin/unlock`. بالذاكرة بس، بيروح لما ينسكّر التطبيق.'

  parameters:
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      description: نسخة تطبيق التاجر. الأقدم من الحد الأدنى بياخد `426 APP_VERSION_UNSUPPORTED`.
      schema: { type: string, example: 1.0.0 }
    AppPlatform:
      name: X-App-Platform
      in: header
      required: true
      schema: { $ref: '#/components/schemas/Platform' }
    Cursor:
      name: cursor
      in: query
      required: false
      description: '`meta.next_cursor` من الصفحة السابقة'
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceToken:
      name: token
      in: path
      required: true
      description: رمز FCM مرمَّز بـ`encodeURIComponent` لأنو فيه `:`
      schema: { type: string }

  headers:
    RetryAfter:
      description: الثواني لحد ما يصير مسموح
      schema: { type: integer }

  requestBodies:
    Device:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token, platform]
            properties:
              token: { type: string, maxLength: 255 }
              platform: { $ref: '#/components/schemas/Platform' }

  responses:
    Unauthenticated:
      description: '`UNAUTHENTICATED`: توكن مفقود أو منتهي أو غلط'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: UNAUTHENTICATED, message: Unauthenticated. } }
    Forbidden:
      description: '`FORBIDDEN`: الحساب ما إلو صلاحية (دور بلوحة الإدارة، أو توكن لتطبيق تاني)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: FORBIDDEN, message: Your role does not allow this action. } }
    NotFound:
      description: '`NOT_FOUND`: العنصر مو موجود أو مو تبع هالحساب'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationFailed:
      description: '`VALIDATION_FAILED`: أخطاء الحقول'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: VALIDATION_FAILED
              message: The business name field must be at least 2 characters. (and 2 more errors)
              details:
                fields:
                  business_name: [min]
                  business_type_id: [required]
                  phone: [format]
    RateLimited:
      description: '`RATE_LIMITED`'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: RATE_LIMITED, message: Too many requests., details: { retry_after_seconds: 30 } } }
    AppVersionUnsupported:
      description: '`APP_VERSION_UNSUPPORTED`: شاشة التحديث الإجباري'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: APP_VERSION_UNSUPPORTED, message: A newer version of the app is required., details: { min_version: 1.0.0, download_url: 'https://…/wafa-merchant.apk' } }
    CustomerNotReady:
      description: '`PROFILE_INCOMPLETE` · `POLICY_CONSENT_REQUIRED` (مع `current_version`)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            PROFILE_INCOMPLETE:
              value: { error: { code: PROFILE_INCOMPLETE, message: Enter your name and date of birth first. } }
            POLICY_CONSENT_REQUIRED:
              value: { error: { code: POLICY_CONSENT_REQUIRED, message: Agree to the current privacy policy first., details: { current_version: '1.2' } } }
    RegistrationIncomplete:
      description: '`REGISTRATION_INCOMPLETE`: التاجر ما كمّل خطوات التسجيل'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: REGISTRATION_INCOMPLETE, message: Finish the registration steps first., details: { registration_step: business } } }
    RegistrationStepMismatch:
      description: '`REGISTRATION_STEP_MISMATCH`: خطوة تسجيل بغير وقتها'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: REGISTRATION_STEP_MISMATCH, message: Registration is at the pin step., details: { registration_step: pin } } }
    PinRequired:
      description: '`PIN_REQUIRED` (`X-Pin-Token` مفقود أو منتهي) · `REGISTRATION_INCOMPLETE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: PIN_REQUIRED, message: Enter the PIN to open this section. } }
    PinInvalid:
      description: '`PIN_INVALID` (الخامسة بترجع `attempts_remaining: 0`) · `VALIDATION_FAILED`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: PIN_INVALID, message: This PIN is not correct., details: { attempts_remaining: 4 } } }
    PinLocked:
      description: '`PIN_LOCKED`: 5 محاولات غلط ورا بعض، قفل 15 دقيقة'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: PIN_LOCKED, message: Too many wrong PINs; try again later., details: { retry_after_seconds: 900 } } }
    CustomerData:
      description: الزبون
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Customer' }
    MerchantMeData:
      description: التاجر
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/MerchantMe' }
    MerchantCardData:
      description: البطاقة
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/MerchantCard' }
    PinTokenData:
      description: توكن الـPIN
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/PinToken' }
    AdminUserData:
      description: حساب الإدارة
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminUser' }
    MerchantProfileData:
      description: ملف المحل
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/MerchantProfile' }
    AdminPackageData:
      description: الباقة
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminPackage' }
    AdminPaymentData:
      description: الدفعة
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminPayment' }
    BillingSettingsData:
      description: الإعدادات
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [exchange_rate_syp, syriatel_cash_number, bank_transfer_details, payment_review_sla_hours, trial_days, grace_days]
                properties:
                  exchange_rate_syp: { $ref: '#/components/schemas/Money' }
                  syriatel_cash_number: { type: string }
                  bank_transfer_details: { type: string }
                  payment_review_sla_hours: { type: integer }
                  trial_days: { type: integer }
                  grace_days: { type: integer }
    AdminMerchantDetailData:
      description: صفحة التاجر
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminMerchantDetail' }
    AdminCustomerData:
      description: صفحة الزبون
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminCustomer' }
    AdminLookupData:
      description: العنصر
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminLookup' }
    AppSettingsData:
      description: الإعدادات
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AppSettings' }
    SubscriptionData:
      description: اشتراك التاجر بعد التغيير
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Subscription' }
    MerchantStatusConflict:
      description: '`MERCHANT_STATUS_CONFLICT`: حالة التاجر ما بتسمح'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: MERCHANT_STATUS_CONFLICT, message: Only a suspended shop can be reactivated., details: { status: ACTIVE } } }
    PaymentNotPending:
      description: '`PAYMENT_NOT_PENDING`: الدفعة انحسمت قبل'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: PAYMENT_NOT_PENDING, message: This payment was already reviewed., details: { status: APPROVED } } }
    NotificationPage:
      description: صفحة إشعارات
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
              meta:
                type: object
                required: [next_cursor]
                properties:
                  next_cursor: { type: [string, 'null'], description: '`null` = ما في صفحات بعد' }

  schemas:
    # ── أساسيات ──
    DateTime:
      type: string
      format: date-time
      example: '2026-09-29T15:00:52Z'
    Phone:
      type: string
      description: '`+9639XXXXXXXX`، والخادم بيقبل كمان `09XXXXXXXX`'
      example: '+963933123456'
    Pin:
      type: string
      pattern: '^\d{4,6}$'
      example: '1234'
    Money:
      type: string
      pattern: '^\d+\.\d{2}$'
      example: '10.00'
    Platform:
      type: string
      enum: [android, ios]
    CardStatus:
      type: string
      enum: [active, suspended]
    CycleStatus:
      type: string
      enum: [COLLECTING, REWARD_READY]
    StampMethod:
      type: string
      enum: [qr, phone]
      description: '`qr` مسح الرمز، `phone` برقمه'
    MerchantStatus:
      type: string
      enum: [TRIAL, ACTIVE, GRACE, EXPIRED, SUSPENDED, PENDING_DELETION]
    AdminRole:
      type: string
      enum: [super_admin, admin, payments_reviewer, support]
    AdminPermission:
      type: string
      enum:
        - manage-admin-accounts
        - manage-packages
        - manage-settings
        - grant-extensions
        - view-audit-log
        - review-payments
        - view-financials
        - suspend-merchants
        - execute-deletion-requests
        - cancel-stamps
        - manage-lookups
        - edit-business-identity
        - edit-customer-birthdate
        - view-merchants-and-customers
        - reveal-customer-phone

    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - RATE_LIMITED
        - APP_VERSION_UNSUPPORTED
        - SERVER_ERROR
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_ATTEMPTS_EXCEEDED
        - OTP_RESEND_TOO_SOON
        - POLICY_VERSION_OUTDATED
        - POLICY_CONSENT_REQUIRED
        - PROFILE_INCOMPLETE
        - PROFILE_ALREADY_COMPLETED
        - UNDER_AGE
        - REGISTRATION_INCOMPLETE
        - REGISTRATION_STEP_MISMATCH
        - PIN_REQUIRED
        - PIN_INVALID
        - PIN_LOCKED
        - PIN_RESET_REQUIRES_RECENT_LOGIN
        - QR_INVALID
        - QR_EXPIRED
        - SCAN_TOKEN_EXPIRED
        - STAMP_INTERVAL
        - REWARD_READY_REDEEM_FIRST
        - NO_REWARD_READY
        - REDEEM_REQUIRES_QR
        - REWARD_ALREADY_REDEEMED
        - CARD_SUSPENDED
        - MERCHANT_STATUS_BLOCKS_ACTION
        - CARDS_LIMIT_REACHED
        - BIRTHDAY_NOT_TODAY
        - CAMPAIGN_WEEKLY_LIMIT_REACHED
        - CAMPAIGN_CONTAINS_LINK
        - PAYMENT_ALREADY_PENDING
        - PRICE_NOT_AVAILABLE
        - KEEP_CARDS_REQUIRED
        - PAYMENT_NOT_PENDING
        - TRIAL_NOT_EXTENDABLE
        - MERCHANT_STATUS_CONFLICT
    Error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: للتطوير بس، بالإنجليزي }
        details:
          type: object
          additionalProperties: true
          description: |
            القيم يلي بيحتاجها النص حسب الرمز. `VALIDATION_FAILED`: `fields` كل حقل مع قائمة أسماء قواعد:
            `required` · `min` · `max` · `size` · `format` · `taken` · `exists` · `before` · `prohibits` · `invalid`.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }

    # ── قوائم ──
    Lookup:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    Icon:
      type: object
      required: [id, key, name]
      properties:
        id: { type: integer }
        key: { type: string, example: coffee-cup, description: التطبيق بيرسم الأيقونة من مكتبته حسب `key` }
        name: { type: string, example: فنجان قهوة }

    # ── الزبون ──
    CustomerConfig:
      type: object
      required: [qr_period_seconds, privacy_policy_version, privacy_policy_url, customer_terms_url, governorates, business_types]
      properties:
        qr_period_seconds: { type: integer, example: 60 }
        privacy_policy_version: { type: string, example: '1.2' }
        privacy_policy_url: { type: string, format: uri }
        customer_terms_url: { type: string, format: uri }
        governorates: { type: array, items: { $ref: '#/components/schemas/Lookup' } }
        business_types: { type: array, items: { $ref: '#/components/schemas/Lookup' } }
    Customer:
      type: object
      description: للزبون نفسه بس
      required: [id, phone, name, birthdate, campaigns_muted, profile_complete, consented_policy_version, registered_at]
      properties:
        id: { type: integer, example: 18 }
        phone: { $ref: '#/components/schemas/Phone' }
        name: { type: [string, 'null'], description: '`null` لحتى يكمّل ملفه' }
        birthdate: { type: [string, 'null'], format: date, example: '1998-05-20' }
        campaigns_muted: { type: boolean, description: إيقاف عروض كل التجار }
        profile_complete: { type: boolean }
        consented_policy_version: { type: [string, 'null'], example: '1.2' }
        registered_at: { $ref: '#/components/schemas/DateTime' }
    CustomerSession:
      type: object
      required: [token, token_type, customer, needs_profile, claimed_stamps]
      properties:
        token: { type: string, example: 10|FJ2HL4cWxpQLwZuDeeAcBWDcAgBc3fuOGaPqmWE5ab4dc686 }
        token_type: { type: string, const: Bearer }
        customer: { $ref: '#/components/schemas/Customer' }
        needs_profile: { type: boolean }
        claimed_stamps:
          type: array
          description: فيها عناصر بس بأول دخول لرقم كان زبون معلّق، لـ«طوابعك وصلت»
          items:
            type: object
            required: [merchant, card, stamps_count, status]
            properties:
              merchant: { $ref: '#/components/schemas/MerchantSummary' }
              card: { $ref: '#/components/schemas/CardSummary' }
              stamps_count: { type: integer }
              status: { $ref: '#/components/schemas/CycleStatus' }
    QrSecret:
      type: object
      required: [qr_id, secret, algorithm, digits, period_seconds]
      properties:
        qr_id: { type: string, example: Q1Pa9zblIBzE }
        secret: { type: string, description: Base32, example: 4XDGTVZPZAQC34IDCLK7GPZOMBYPLY3Q }
        algorithm: { type: string, const: SHA256 }
        digits: { type: integer, const: 8 }
        period_seconds: { type: integer, example: 60 }

    # ── البطاقات ──
    CardSummary:
      type: object
      required: [id, name, stamps_required, reward_description, terms, icon, status]
      properties:
        id: { type: integer, example: 11 }
        name: { type: string, example: بطاقة القهوة }
        stamps_required: { type: integer, example: 3 }
        reward_description: { type: string, example: فنجان قهوة مجاني }
        terms: { type: [string, 'null'] }
        icon: { $ref: '#/components/schemas/Icon' }
        status: { $ref: '#/components/schemas/CardStatus' }
    MerchantSummary:
      type: object
      required: [id, business_name, logo_url, business_type, governorate]
      properties:
        id: { type: integer, example: 10 }
        business_name: { type: string, example: كافيه الياسمين }
        logo_url: { type: [string, 'null'], format: uri }
        business_type: { $ref: '#/components/schemas/Lookup' }
        governorate: { $ref: '#/components/schemas/Lookup' }
    CycleProgress:
      type: object
      description: '`id: null` مع `stamps_count: 0` يعني ما في دورة مفتوحة، والدورة الجديدة بتنفتح مع الطابع الجاي.'
      required: [id, stamps_count, status, completed_at]
      properties:
        id: { type: [integer, 'null'], example: 17 }
        stamps_count: { type: integer, example: 1 }
        status: { $ref: '#/components/schemas/CycleStatus' }
        completed_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
    CustomerCard:
      type: object
      required: [card, merchant, cycle, completed_cycles_count, last_stamp_at, merchant_muted]
      properties:
        card: { $ref: '#/components/schemas/CardSummary' }
        merchant: { $ref: '#/components/schemas/MerchantSummary' }
        cycle: { $ref: '#/components/schemas/CycleProgress' }
        completed_cycles_count: { type: integer, description: كم مرة استلم هدية هالبطاقة }
        last_stamp_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }], description: آخر طابع غير ملغى }
        merchant_muted: { type: boolean, description: موقّف عروض هالمحل }
    CustomerCardDetail:
      allOf:
        - $ref: '#/components/schemas/CustomerCard'
        - type: object
          required: [stamps, merchant_address]
          properties:
            stamps:
              type: array
              description: طوابع الدورة الحالية، الأقدم أول
              items:
                type: object
                required: [stamped_at, method]
                properties:
                  stamped_at: { $ref: '#/components/schemas/DateTime' }
                  method: { $ref: '#/components/schemas/StampMethod' }
            merchant_address: { type: [string, 'null'], example: دمشق، شارع الحمرا }
    MerchantCard:
      allOf:
        - $ref: '#/components/schemas/CardSummary'
        - type: object
          required: [created_at, suspended_at, active_customers, rewards_ready]
          properties:
            created_at: { $ref: '#/components/schemas/DateTime' }
            suspended_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
            active_customers: { type: integer, description: زبائن إلهم دورة مفتوحة على البطاقة }
            rewards_ready: { type: integer, description: هدايا جاهزة ما انسلّمت }

    # ── الإشعارات ──
    Notification:
      type: object
      required: [id, type, title, body, data, read_at, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [stamp_added, card_completed, reward_redeemed, campaign, birthday_greeting, birthdays_today, trial_ending, subscription_ending, grace_started, subscription_expired, payment_approved, payment_rejected]
          description: |
            `stamp_added`: «أُضيف لك طابع عند [المحل]. صار لديك 1 من 3.»
            `card_completed`: «هديتك جاهزة!» / «اكتملت بطاقتك في [المحل]. اعرض رمزك للكاشير لتستلم [وصف الهدية].»
            `reward_redeemed`: «استلمت هديتك من [المحل]. بدأت بطاقتك الجديدة.»
            `campaign`: «[المحل]: [عنوان الحملة]» / نص الحملة، و`data` فيها `merchant_id` و`campaign_id`.
            `birthday_greeting`: «عيد ميلاد سعيد من [المحل]» / رسالة التاجر، ومعها سطر «هديتك: [الهدية]» إذا في هدية.
            `birthdays_today` (للتاجر): «أعياد ميلاد اليوم» / «اليوم عيد ميلاد N من زبائنك. هنّئهم من التطبيق.»
            للتاجر كمان: `trial_ending` و`subscription_ending` (قبل 3 أيام)، و`grace_started`، و`subscription_expired`،
            و`payment_approved` و`payment_rejected` (مع `payment_id`، والرفض مع `reason`).

            كل إشعار بينبعت كمان push عن طريق FCM بنفس العنوان والنص، و`data` فيها `type` و`notification_id`
            والمعرّفات، **كلها نصوص**.
        title: { type: string }
        body: { type: string }
        data:
          type: object
          description: المعرّفات لتفتح البطاقة لما يضغط (للتهنئة `merchant_id` بس، ولـ`birthdays_today` بس `count`)
          properties:
            merchant_id: { type: integer }
            card_id: { type: integer }
            cycle_id: { type: integer }
            count: { type: integer }
            campaign_id: { type: integer }
            period_id: { type: integer }
            payment_id: { type: integer }
            reason: { $ref: '#/components/schemas/PaymentRejectionReason' }
        read_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/DateTime' }

    # ── التاجر ──
    RegisterBusinessInput:
      type: object
      required: [business_name, business_type_id, governorate_id, owner_name, phone]
      properties:
        business_name: { type: string, minLength: 2, maxLength: 80, description: ما بيتعدّل بعدين إلا من الدعم }
        business_type_id: { type: integer, description: من `lookups.business_types` }
        governorate_id: { type: integer, description: من `lookups.governorates` }
        address: { type: [string, 'null'], maxLength: 255 }
        owner_name: { type: string, minLength: 2, maxLength: 80 }
        phone: { $ref: '#/components/schemas/Phone', description: رقم تواصل المحل، مو للدخول. فريد بين التجار }
    MerchantProfile:
      type: object
      required: [id, email, business_name, business_type, governorate, address, owner_name, phone, contact_phone, logo_url, created_at]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        business_name: { type: string }
        business_type: { $ref: '#/components/schemas/Lookup' }
        governorate: { $ref: '#/components/schemas/Lookup' }
        address: { type: [string, 'null'] }
        owner_name: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        contact_phone: { type: [string, 'null'], description: الرقم المنشور للزبائن }
        logo_url: { type: [string, 'null'], format: uri }
        created_at: { $ref: '#/components/schemas/DateTime' }
    PackageSummary:
      type: object
      required: [id, name, cards_limit, weekly_campaigns_limit]
      properties:
        id: { type: integer }
        name: { type: string, example: المتوسطة }
        cards_limit: { type: integer }
        weekly_campaigns_limit: { type: integer }
    SubscriptionPeriod:
      type: object
      required: [id, type, package, duration_months, starts_at, ends_at, grace_ends_at]
      properties:
        id: { type: integer }
        type: { type: string, enum: [trial, paid] }
        package: { $ref: '#/components/schemas/PackageSummary' }
        duration_months: { type: [integer, 'null'], enum: [1, 3, 12, null] }
        starts_at: { $ref: '#/components/schemas/DateTime' }
        ends_at: { $ref: '#/components/schemas/DateTime' }
        grace_ends_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
    Payment:
      type: object
      required: [id, package, duration_months, price_usd, exchange_rate, amount_syp, method, reference, proof_url, status, rejection_reason, created_at, reviewed_at]
      properties:
        id: { type: integer }
        package: { $ref: '#/components/schemas/PackageSummary' }
        duration_months: { type: integer, enum: [1, 3, 12] }
        price_usd: { $ref: '#/components/schemas/Money' }
        exchange_rate: { $ref: '#/components/schemas/Money' }
        amount_syp: { $ref: '#/components/schemas/Money' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        reference: { type: [string, 'null'] }
        proof_url: { type: string, format: uri }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        rejection_reason: { oneOf: [{ $ref: '#/components/schemas/PaymentRejectionReason' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/DateTime' }
        reviewed_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
    Capabilities:
      type: object
      description: |
        شو مسموح هلق، للعرض. `TRIAL` و`ACTIVE` و`GRACE` كلها `true`. وبـ`EXPIRED` و`SUSPENDED` و`PENDING_DELETION`
        بس `redemptions: true`.
      required: [stamps, new_customers, campaigns, redemptions, create_cards, directory_visible]
      properties:
        stamps: { type: boolean }
        new_customers: { type: boolean }
        campaigns: { type: boolean }
        redemptions: { type: boolean }
        create_cards: { type: boolean }
        directory_visible: { type: boolean }
    Banner:
      type: object
      description: |
        `TRIAL_ENDING` / `SUBSCRIPTION_ENDING`: باقي 3 أيام أو أقل (`warning`). `GRACE`: مهلة السماح (`danger`).
        `EXPIRED` · `SUSPENDED` · `PENDING_DELETION`: الحالة نفسها (`danger`، بدون `params`).
      required: [code, level, params]
      properties:
        code: { type: string, enum: [TRIAL_ENDING, SUBSCRIPTION_ENDING, GRACE, EXPIRED, SUSPENDED, PENDING_DELETION] }
        level: { type: string, enum: [warning, danger] }
        params:
          type: [object, 'null']
          properties:
            days_remaining: { type: integer }
            ends_at: { $ref: '#/components/schemas/DateTime' }
    Subscription:
      type: object
      required: [status, package, current_period, trial_used, days_remaining, capabilities, banner, pending_payment]
      properties:
        status: { $ref: '#/components/schemas/MerchantStatus' }
        package: { $ref: '#/components/schemas/PackageSummary' }
        current_period: { oneOf: [{ $ref: '#/components/schemas/SubscriptionPeriod' }, { type: 'null' }] }
        trial_used: { type: boolean }
        days_remaining: { type: [integer, 'null'], description: لنهاية التجربة أو الاشتراك، أو لنهاية المهلة بـ`GRACE`. `null` بباقي الحالات }
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        banner: { oneOf: [{ $ref: '#/components/schemas/Banner' }, { type: 'null' }] }
        pending_payment: { oneOf: [{ $ref: '#/components/schemas/Payment' }, { type: 'null' }] }
    Usage:
      type: object
      required: [active_cards, cards_limit, campaigns_used_this_week, weekly_campaigns_limit, campaigns_resets_at]
      properties:
        active_cards: { type: integer }
        cards_limit: { type: integer }
        campaigns_used_this_week: { type: integer }
        weekly_campaigns_limit: { type: integer }
        campaigns_resets_at:
          $ref: '#/components/schemas/DateTime'
          description: |
            بداية الأسبوع الجاي: السبت 00:00 بتوقيت دمشق، مكتوب بـUTC (`2026-10-02T21:00:00Z` = السبت 3 تشرين الأول
            00:00 بدمشق). الأسبوع تقويمي من السبت للجمعة.
    MerchantMe:
      type: object
      description: قبل ما يكمّل الخطوة الأولى `merchant` و`subscription` و`usage` كلها `null`.
      required: [registration_step, email, merchant, subscription, usage]
      properties:
        registration_step: { type: string, enum: [business, package, pin, done] }
        email: { type: string, format: email }
        merchant: { oneOf: [{ $ref: '#/components/schemas/MerchantProfile' }, { type: 'null' }] }
        subscription: { oneOf: [{ $ref: '#/components/schemas/Subscription' }, { type: 'null' }] }
        usage: { oneOf: [{ $ref: '#/components/schemas/Usage' }, { type: 'null' }] }
    MerchantLookups:
      type: object
      required: [governorates, business_types, icons, trial_days, packages, payment, limits, links]
      properties:
        governorates: { type: array, items: { $ref: '#/components/schemas/Lookup' } }
        business_types: { type: array, items: { $ref: '#/components/schemas/Lookup' } }
        icons: { type: array, items: { $ref: '#/components/schemas/Icon' } }
        trial_days: { type: integer, example: 14, description: مدة التجربة المجانية بالأيام. حقل زيادة عن العقد }
        packages:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/PackageSummary'
              - type: object
                required: [prices]
                properties:
                  prices:
                    type: array
                    items:
                      type: object
                      required: [duration_months, price_usd, amount_syp]
                      properties:
                        duration_months: { type: integer, enum: [1, 3, 12] }
                        price_usd: { $ref: '#/components/schemas/Money' }
                        amount_syp: { $ref: '#/components/schemas/Money', description: بسعر الصرف الحالي، للعرض بس }
        payment:
          type: object
          required: [exchange_rate_syp, syriatel_cash_number, bank_transfer_details, review_sla_hours]
          properties:
            exchange_rate_syp: { $ref: '#/components/schemas/Money' }
            syriatel_cash_number: { type: string }
            bank_transfer_details: { type: string }
            review_sla_hours: { type: integer, example: 24 }
        limits:
          type: object
          required: [card_stamps_min, card_stamps_max, campaign_title_max, campaign_body_max, stamp_interval_minutes, pin_unlock_hours]
          properties:
            card_stamps_min: { type: integer, example: 3 }
            card_stamps_max: { type: integer, example: 10 }
            campaign_title_max: { type: integer, example: 60 }
            campaign_body_max: { type: integer, example: 300 }
            stamp_interval_minutes: { type: integer, example: 60 }
            pin_unlock_hours: { type: integer, example: 12 }
        links:
          type: object
          required: [privacy_policy_url, merchant_terms_url]
          properties:
            privacy_policy_url: { type: string, format: uri }
            merchant_terms_url: { type: string, format: uri }
    PinToken:
      type: object
      required: [pin_token, expires_at]
      properties:
        pin_token: { type: string, example: eyJpdiI6IjI5ZGgzSWRKQzdI… }
        expires_at: { $ref: '#/components/schemas/DateTime' }

    # ── المسح والطوابع ──
    ScanCustomer:
      type: object
      description: |
        `registered`: زبون مسجّل، بيظهر `name` و`phone_masked`.
        `pending`: رقم انضافله طوابع قبل وما سجّل، بالمعاينة `phone_full` بس.
        `new`: رقم ما إلو أي حساب (`id: null`)، `phone_full` بس ليتأكد الكاشير من الرقم.
        بعد حفظ الطابع الرقم دايماً مخفي.
      required: [id, kind, name, phone_full, phone_masked]
      properties:
        id: { type: [integer, 'null'] }
        kind: { type: string, enum: [registered, pending, new] }
        name: { type: [string, 'null'] }
        phone_full: { type: [string, 'null'] }
        phone_masked: { type: [string, 'null'], example: 0933***456 }
    ScanPreview:
      type: object
      required: [scan_token, expires_at, method, customer, card, cycle, action, blocked_reason, other_ready_rewards]
      properties:
        scan_token: { type: string }
        expires_at: { $ref: '#/components/schemas/DateTime' }
        method: { $ref: '#/components/schemas/StampMethod' }
        customer: { $ref: '#/components/schemas/ScanCustomer' }
        card: { $ref: '#/components/schemas/CardSummary' }
        cycle: { $ref: '#/components/schemas/CycleProgress' }
        action:
          type: string
          enum: [stamp, redeem, none]
          description: |
            الزر الوحيد بشاشة التأكيد. `stamp` ← `POST /merchant/stamps`. `redeem` ← `POST /merchant/redemptions`
            بـ`cycle.id`. `none` ← ما في زر، اعرض `blocked_reason`.
        blocked_reason:
          description: |
            مع `action: none` بس. `STAMP_INTERVAL` · `CARD_SUSPENDED` (بطاقة موقوفة وما في دورة مفتوحة) ·
            `MERCHANT_STATUS_BLOCKS_ACTION` (`action: stamps`) · `REDEEM_REQUIRES_QR`.
          oneOf: [{ $ref: '#/components/schemas/Error' }, { type: 'null' }]
        other_ready_rewards:
          type: array
          description: هدايا جاهزة لنفس الزبون على بطاقات تانية بالمحل. بتنسلّم بنفس `scan_token` إذا `method = qr`.
          items:
            type: object
            required: [cycle_id, card, completed_at]
            properties:
              cycle_id: { type: integer }
              card: { $ref: '#/components/schemas/CardSummary' }
              completed_at: { $ref: '#/components/schemas/DateTime' }
    StampResult:
      type: object
      description: إذا اكتملت البطاقة بهالطابع `cycle.status = REWARD_READY` مع `completed_at`.
      required: [stamp, cycle, card, customer]
      properties:
        stamp:
          type: object
          required: [id, stamped_at, method]
          properties:
            id: { type: integer }
            stamped_at: { $ref: '#/components/schemas/DateTime' }
            method: { $ref: '#/components/schemas/StampMethod' }
        cycle: { $ref: '#/components/schemas/CycleProgress' }
        card: { $ref: '#/components/schemas/CardSummary' }
        customer: { $ref: '#/components/schemas/ScanCustomer' }
    RedemptionResult:
      type: object
      required: [cycle_id, redeemed_at, card, next_cycle_available]
      properties:
        cycle_id: { type: integer }
        redeemed_at: { $ref: '#/components/schemas/DateTime' }
        card: { $ref: '#/components/schemas/CardSummary' }
        next_cycle_available: { type: boolean, description: '`false` إذا البطاقة موقوفة، فما في دورة جديدة' }

    # ── أعياد الميلاد ──
    BirthdayCustomer:
      type: object
      required: [id, name, birthday, greeted_today]
      properties:
        id: { type: integer }
        name: { type: string }
        birthday: { type: string, pattern: '^\d{2}-\d{2}$', example: 09-30, description: الشهر واليوم، بدون سنة }
        greeted_today: { type: boolean }
    BirthdayGreeting:
      type: object
      required: [customer_id, greeted_on, message, gift]
      properties:
        customer_id: { type: integer }
        greeted_on: { type: string, format: date, example: '2026-09-30' }
        message: { type: string }
        gift: { type: [string, 'null'] }

    CursorMeta:
      type: object
      required: [next_cursor]
      properties:
        next_cursor: { type: [string, 'null'], description: '`null` = ما في صفحات بعد' }
    DirectoryMerchant:
      allOf:
        - $ref: '#/components/schemas/MerchantSummary'
        - type: object
          required: [address, active_cards_count]
          properties:
            address: { type: [string, 'null'] }
            active_cards_count: { type: integer }
    ShopContact:
      allOf:
        - $ref: '#/components/schemas/MerchantSummary'
        - type: object
          required: [address, contact_phone]
          properties:
            address: { type: [string, 'null'] }
            contact_phone: { type: [string, 'null'], example: '+963112223344' }
    MerchantPage:
      allOf:
        - $ref: '#/components/schemas/MerchantSummary'
        - type: object
          required: [address, accepting_stamps, muted, cards]
          properties:
            address: { type: [string, 'null'] }
            accepting_stamps: { type: boolean, description: '`false` للمنتهي أو الموقوف أو بانتظار الحذف' }
            muted: { type: boolean }
            cards:
              type: array
              description: البطاقات الفعّالة بس
              items: { $ref: '#/components/schemas/CardSummary' }
    StatsBlock:
      type: object
      required: [customers_total, stamps_today, stamps_this_week, stamps_via_phone_today, rewards_ready, rewards_redeemed_total]
      properties:
        customers_total: { type: integer }
        stamps_today: { type: integer }
        stamps_this_week: { type: integer }
        stamps_via_phone_today: { type: integer }
        rewards_ready: { type: integer, description: هدايا جاهزة لسا ما انسلّمت }
        rewards_redeemed_total: { type: integer }
    MerchantStats:
      type: object
      required: [generated_at, totals, per_card, daily]
      properties:
        generated_at: { $ref: '#/components/schemas/DateTime' }
        totals: { $ref: '#/components/schemas/StatsBlock' }
        per_card:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/StatsBlock'
              - type: object
                required: [card_id, card_name, status]
                properties:
                  card_id: { type: integer }
                  card_name: { type: string }
                  status: { $ref: '#/components/schemas/CardStatus' }
        daily:
          type: array
          description: يوم لكل عنصر، الأقدم أول، بطول `days`
          items:
            type: object
            required: [date, stamps, stamps_via_phone, rewards_redeemed]
            properties:
              date: { type: string, format: date }
              stamps: { type: integer }
              stamps_via_phone: { type: integer }
              rewards_redeemed: { type: integer }
    MerchantCustomer:
      type: object
      required: [id, name, phone_masked, registered, last_stamp_at, cards]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'], description: '`null` للزبون المعلّق' }
        phone_masked: { type: [string, 'null'], example: 0933***456 }
        registered: { type: boolean }
        last_stamp_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        cards:
          type: array
          description: الدورات المفتوحة بس
          items:
            type: object
            required: [card_id, card_name, stamps_count, stamps_required, status]
            properties:
              card_id: { type: integer }
              card_name: { type: string }
              stamps_count: { type: integer }
              stamps_required: { type: integer }
              status: { $ref: '#/components/schemas/CycleStatus' }
    Campaign:
      type: object
      required: [id, title, body, recipients_count, sent_at]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        recipients_count: { type: integer, description: عدد المستلمين لحظة الإرسال }
        sent_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
    PaymentMethod:
      type: string
      enum: [syriatel_cash, transfer]
    PaymentRejectionReason:
      type: string
      enum: [transfer_not_received, amount_short, unclear_image, invalid_proof]
    PackageInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        cards_limit: { type: integer, minimum: 1, maximum: 20 }
        weekly_campaigns_limit: { type: integer, minimum: 0, maximum: 20 }
        is_active: { type: boolean }
        sort_order: { type: integer, minimum: 0, maximum: 1000 }
        prices:
          type: array
          minItems: 1
          items:
            type: object
            required: [duration_months, price_usd]
            properties:
              duration_months: { type: integer, enum: [1, 3, 12] }
              price_usd: { type: [number, 'null'], minimum: 0.01, maximum: 99999, description: '`null` بالتعديل بيشيل المدة' }
    AdminPackage:
      type: object
      required: [id, name, cards_limit, weekly_campaigns_limit, is_active, sort_order, prices]
      properties:
        id: { type: integer }
        name: { type: string }
        cards_limit: { type: integer }
        weekly_campaigns_limit: { type: integer }
        is_active: { type: boolean }
        sort_order: { type: integer }
        prices:
          type: array
          items:
            type: object
            required: [duration_months, price_usd]
            properties:
              duration_months: { type: integer, enum: [1, 3, 12] }
              price_usd: { $ref: '#/components/schemas/Money' }
    AdminPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required: [merchant, overdue, duplicate_reference, reviewed_by, subscription_period_id]
          properties:
            merchant:
              type: [object, 'null']
              properties:
                id: { type: integer }
                business_name: { type: string }
                email: { type: [string, 'null'] }
                status: { $ref: '#/components/schemas/MerchantStatus' }
            overdue: { type: boolean, description: مرّت مدة المراجعة والدفعة لسا معلّقة }
            duplicate_reference: { type: boolean, description: نفس رقم المرجع بدفعة تانية }
            reviewed_by:
              type: [object, 'null']
              properties:
                id: { type: integer }
                name: { type: string }
            subscription_period_id: { type: [integer, 'null'] }

    # ── الإدارة ──
    AdminUser:
      type: object
      required: [id, name, email, role, is_active, linked, last_login_at]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/AdminRole' }
        is_active: { type: boolean }
        linked: { type: boolean, description: '`false` لحد ما يفوت صاحب البريد على اللوحة بـClerk' }
        last_login_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
    CancelledStamp:
      type: object
      required: [id, cancelled_at, cancel_reason, cycle]
      properties:
        id: { type: integer }
        cancelled_at: { $ref: '#/components/schemas/DateTime' }
        cancel_reason: { type: string }
        cycle: { $ref: '#/components/schemas/CycleProgress' }
    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 255, description: بينكتب بسجل التدقيق }
    AdminMerchant:
      type: object
      required: [id, business_name, owner_name, email, phone, contact_phone, logo_url, business_type, governorate, status, registration_step, package, subscription_ends_at, suspended_at, suspension_reason, registered_at]
      properties:
        id: { type: integer }
        business_name: { type: string }
        owner_name: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { $ref: '#/components/schemas/Phone' }
        contact_phone: { type: [string, 'null'] }
        logo_url: { type: [string, 'null'], format: uri }
        business_type: { $ref: '#/components/schemas/Lookup' }
        governorate: { $ref: '#/components/schemas/Lookup' }
        status: { oneOf: [{ $ref: '#/components/schemas/MerchantStatus' }, { type: 'null' }], description: '`null` لحد ما يختار باقة' }
        registration_step: { type: string, enum: [package, pin, done], description: '`package`: لم يختر باقة بعد. `pin`: ما حط PIN' }
        package: { oneOf: [{ $ref: '#/components/schemas/PackageSummary' }, { type: 'null' }], description: باقة الفترة الحالية، أو آخر باقة }
        subscription_ends_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }], description: نهاية آخر فترة }
        suspended_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        suspension_reason: { type: [string, 'null'] }
        registered_at: { $ref: '#/components/schemas/DateTime' }
    AdminMerchantDetail:
      allOf:
        - $ref: '#/components/schemas/AdminMerchant'
        - type: object
          required: [address, last_login_at, subscription, periods, payments, cards, stats]
          properties:
            address: { type: [string, 'null'] }
            last_login_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
            subscription: { oneOf: [{ $ref: '#/components/schemas/Subscription' }, { type: 'null' }], description: '`null` لحد ما يختار باقة' }
            periods:
              type: array
              description: كل الفترات، الأحدث أول
              items: { $ref: '#/components/schemas/SubscriptionPeriod' }
            payments:
              type: array
              description: آخر 10 دفعات
              items: { $ref: '#/components/schemas/Payment' }
            cards:
              type: array
              items:
                type: object
                required: [id, name, icon_key, stamps_required, reward_description, terms, status, customers_count, created_at, suspended_at]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  icon_key: { type: string }
                  stamps_required: { type: integer }
                  reward_description: { type: string }
                  terms: { type: [string, 'null'] }
                  status: { $ref: '#/components/schemas/CardStatus' }
                  customers_count: { type: integer }
                  created_at: { $ref: '#/components/schemas/DateTime' }
                  suspended_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
            stats:
              type: object
              description: من أول ما فتح المحل، والطوابع الملغاة ما بتنحسب
              required: [customers_total, stamps_total, stamps_via_phone_total, rewards_ready, rewards_redeemed_total, campaigns_total]
              properties:
                customers_total: { type: integer }
                stamps_total: { type: integer }
                stamps_via_phone_total: { type: integer }
                rewards_ready: { type: integer }
                rewards_redeemed_total: { type: integer }
                campaigns_total: { type: integer }
    AdminCustomer:
      type: object
      required: [id, name, phone_masked, birthdate, registered, registered_at, last_activity_at, campaigns_muted, created_at]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'] }
        phone_masked: { type: [string, 'null'], example: 0933***222 }
        birthdate: { type: [string, 'null'], format: date }
        registered: { type: boolean }
        registered_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        last_activity_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        campaigns_muted: { type: boolean }
        created_at: { $ref: '#/components/schemas/DateTime' }
        cycles:
          type: array
          description: بصفحة الزبون بس، مو بنتيجة البحث
          items:
            type: object
            required: [id, merchant, card, stamps_count, stamps_required, status, started_at, completed_at, redeemed_at]
            properties:
              id: { type: integer }
              merchant: { $ref: '#/components/schemas/AdminCycleMerchant' }
              card:
                type: object
                required: [id, name, status]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  status: { $ref: '#/components/schemas/CardStatus' }
              stamps_count: { type: integer }
              stamps_required: { type: integer }
              status: { $ref: '#/components/schemas/CycleStatus' }
              started_at: { $ref: '#/components/schemas/DateTime' }
              completed_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
              redeemed_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
    AdminCycleMerchant:
      type: object
      required: [id, business_name]
      properties:
        id: { type: integer }
        business_name: { type: string }
    AdminCardCycle:
      type: object
      required: [id, customer_id, merchant, card, stamps_count, stamps_required, status, started_at, completed_at, redeemed_at, stamps]
      properties:
        id: { type: integer }
        customer_id: { type: integer }
        merchant: { $ref: '#/components/schemas/AdminCycleMerchant' }
        card:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        stamps_count: { type: integer }
        stamps_required: { type: integer }
        status: { $ref: '#/components/schemas/CycleStatus' }
        started_at: { $ref: '#/components/schemas/DateTime' }
        completed_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        redeemed_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        stamps:
          type: array
          description: بالترتيب، والملغاة معها
          items:
            type: object
            required: [id, method, stamped_at, cancelled_at, cancel_reason, cancelled_by]
            properties:
              id: { type: integer }
              method: { $ref: '#/components/schemas/StampMethod' }
              stamped_at: { $ref: '#/components/schemas/DateTime' }
              cancelled_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
              cancel_reason: { type: [string, 'null'] }
              cancelled_by:
                oneOf:
                  - type: object
                    required: [id, name]
                    properties:
                      id: { type: integer }
                      name: { type: string }
                  - type: 'null'
    AdminLookup:
      type: object
      required: [id, name, sort_order, is_active]
      properties:
        id: { type: integer }
        key: { type: string, description: للأيقونات بس }
        name: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }
    AppSettings:
      type: object
      required: [stamp_interval_minutes, card_stamps_min, card_stamps_max, qr_period_seconds, campaign_title_max, campaign_body_max, merchant_min_app_version, merchant_app_download_url, privacy_policy_url, customer_terms_url, merchant_terms_url, pin_unlock_hours]
      properties:
        stamp_interval_minutes: { type: integer }
        card_stamps_min: { type: integer }
        card_stamps_max: { type: integer }
        qr_period_seconds: { type: integer }
        campaign_title_max: { type: integer }
        campaign_body_max: { type: integer }
        merchant_min_app_version: { type: string, description: فاضي يعني ما في حد أدنى }
        merchant_app_download_url: { type: string }
        privacy_policy_url: { type: string }
        customer_terms_url: { type: string }
        merchant_terms_url: { type: string }
        pin_unlock_hours: { type: integer }
    AuditLogEntry:
      type: object
      required: [id, action, admin, subject_type, subject_id, before, after, ip_address, created_at]
      properties:
        id: { type: integer }
        action: { type: string, example: merchant.suspended }
        admin:
          description: '`null` للعمليات يلي عملها النظام لحالو'
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: integer }
                name: { type: string }
            - type: 'null'
        subject_type: { type: [string, 'null'] }
        subject_id: { type: [integer, 'null'] }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        ip_address: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/DateTime' }
