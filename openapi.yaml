        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/icons:
    get:
      tags: [الإدارة — القوائم]
      operationId: adminListIcons
      summary: الأيقونات
      description: كلها، والمعطّل معها، مرتبة بـ`sort_order`. الصلاحية `manage-lookups`.
      security: [{ clerkSession: [] }]
      responses:
        '200':
          description: القائمة
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminLookup' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
