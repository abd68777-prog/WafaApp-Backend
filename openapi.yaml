openapi: 3.1.0

info:
  title: وفاء — Wafa API
  version: 1.0.0
  description: |
    كل endpoint شغّال حالياً بالباك إند، مطابق لـ`api.md` ولعقد Deep Code (`1.0.0-draft.1`).

    - **الطلبات والردود:** JSON فقط، إلا رفع الشعار بالتسجيل (`multipart/form-data`).
    - **التواريخ:** ISO 8601 بتوقيت UTC، مثل `2026-09-29T15:00:52Z`. وتاريخ الميلاد لحاله: `1998-05-20`.
    - **الهاتف:** `+9639XXXXXXXX`، والخادم بيقبل كمان `0933123456` وبيحوّلها.
    - **المبالغ:** نصوص عشرية مو أرقام، مثل `"10.00"`.
    - **الأخطاء:** `{ "error": { "code", "message", "details" } }`. اعرض للمستخدم نصاً حسب `error.code`،
      والـ`message` للتطوير بس، بالإنجليزي.
    - **حدود الطلبات:** 60 بالدقيقة لكل توكن (أو لكل IP بدون توكن). الرد `429` فيه `Retry-After`.

servers:
  - url: http://127.0.0.1:8000/api/v1
    description: محلي (ومن موبايل على نفس الشبكة استعمل IP الكمبيوتر)

tags:
  - name: عام
  - name: الزبون — الدخول
  - name: الزبون — الحساب
  - name: الزبون — البطاقات
  - name: الزبون — دليل المحلات
  - name: الزبون — الإشعارات والأجهزة
  - name: التاجر — الحساب والتسجيل
  - name: التاجر — الـPIN
  - name: التاجر — البطاقات
  - name: التاجر — المسح والطوابع
  - name: التاجر — أعياد الميلاد
  - name: التاجر — الإحصاءات والزبائن
  - name: التاجر — ملف المحل
  - name: التاجر — الحملات
  - name: التاجر — الاشتراك والدفع
  - name: التاجر — الإشعارات والأجهزة
  - name: الإدارة
  - name: الإدارة — الباقات والإعدادات
  - name: الإدارة — مراجعة الدفعات
  - name: الإدارة — التجار
  - name: الإدارة — الزبائن
  - name: الإدارة — القوائم
  - name: الإدارة — سجل التدقيق
  - name: للخادم فقط

paths:
  # ───────────────────────────── عام ─────────────────────────────
  /ping:
    get:
      tags: [عام]
      operationId: ping
      summary: فحص الاتصال
      security: []
      responses:
        '200':
          description: الخادم شغّال
          content:
            application/json:
              schema:
                type: object
                required: [message, version, time]
                properties:
                  message: { type: string, const: pong }
                  version: { type: string, example: v1 }
                  time: { $ref: '#/components/schemas/DateTime' }

  # ─────────────────────────── تطبيق الزبون ───────────────────────────
  /customer/config:
    get:
      tags: [الزبون — الدخول]
      operationId: customerConfig
      summary: إعدادات التطبيق والقوائم
      description: بدون مصادقة. بيتقرأ عند فتح التطبيق وبيتخزّن محلياً.
      security: []
      responses:
        '200':
          description: الإعدادات
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CustomerConfig' }

  /customer/auth/otp:
    post:
      tags: [الزبون — الدخول]
      operationId: customerRequestOtp
      summary: طلب رمز دخول على واتساب
      description: |
        بيبعت رمز من 6 أرقام على واتساب، صالح 5 دقائق. الرد نفسه سواء الرقم مسجّل أو لأ.
        الحد: 5 بالساعة لكل رقم، و20 لكل IP، ومهلة 60 ثانية بين رمز ورمز.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
      responses:
        '202':
          description: انبعت الرمز
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [expires_in_seconds, resend_after_seconds]
                    properties:
                      expires_in_seconds: { type: integer, example: 300 }
                      resend_after_seconds: { type: integer, example: 60 }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: '`OTP_RESEND_TOO_SOON` قبل انتهاء المهلة، أو `RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: OTP_RESEND_TOO_SOON, message: Please wait before requesting another code., details: { retry_after_seconds: 42 } }
        '503':
          description: '`SERVER_ERROR`: ما قدرنا نبعت الرسالة'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /customer/auth/verify:
    post:
      tags: [الزبون — الدخول]
      operationId: customerVerifyOtp
      summary: التحقق من الرمز وإصدار التوكن
      description: |
        إذا الرقم جديد بينشئ الحساب، وإذا كان «زبون معلّق» (تاجر أضافله طوابع برقمه) بيكمّل نفس الحساب
        وطوابعه معه. وبيسجّل الموافقة على السياسة. `POLICY_VERSION_OUTDATED` بيتفحص قبل الرمز، فالرمز بيضل صالح.
        الحد: 10 بالدقيقة لكل رقم، و30 لكل IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, policy_version]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                code: { type: string, pattern: '^\d{6}$', example: '123456' }
                policy_version: { type: string, maxLength: 16, example: '1.2', description: الإصدار يلي شافه الزبون، من `config` }
      responses:
        '200':
          description: دخل الزبون
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CustomerSession' }
        '422':
          description: '`OTP_INVALID` · `OTP_EXPIRED` · `OTP_ATTEMPTS_EXCEEDED` · `POLICY_VERSION_OUTDATED` · `VALIDATION_FAILED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                OTP_INVALID:
                  value: { error: { code: OTP_INVALID, message: The verification code is not correct., details: { attempts_remaining: 4 } } }
                OTP_EXPIRED:
                  value: { error: { code: OTP_EXPIRED, message: No valid code for this number; request a new one. } }
                POLICY_VERSION_OUTDATED:
                  value: { error: { code: POLICY_VERSION_OUTDATED, message: This is not the current privacy policy., details: { current_version: '1.2' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /customer/auth/logout:
    post:
      tags: [الزبون — الدخول]
      operationId: customerLogout
      summary: الخروج
      description: بيبطل التوكن الحالي بس. ابعت `DELETE /customer/devices/{token}` **قبله** لتوقف الإشعارات على الجهاز.
      security: [{ customerToken: [] }]
      responses:
        '204': { description: طلع }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /customer/me:
    get:
      tags: [الزبون — الحساب]
      operationId: customerMe
      summary: حساب الزبون
      description: |
        بيشتغل حتى لو الملف ناقص أو الموافقة قديمة، وهو يلي بيقرر أي شاشة تنعرض:
        `profile_complete = false` ← شاشة الاسم وتاريخ الميلاد،
        `consented_policy_version ≠ config.privacy_policy_version` ← شاشة الموافقة.
      security: [{ customerToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/CustomerData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [الزبون — الحساب]
      operationId: customerUpdateMe
      summary: إيقاف عروض كل التجار
      description: الحقل الوحيد القابل للتعديل. الاسم وتاريخ الميلاد ما بيتعدّلوا من التطبيق. (جاهز)
      security: [{ customerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaigns_muted]
              properties:
                campaigns_muted: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/CustomerData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CustomerNotReady' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [الزبون — الحساب]
      operationId: customerDeleteMe
      summary: حذف الحساب فوراً
      description: |
        بينمسحوا الرقم، والاسم، وتاريخ الميلاد، ورمز الـQR، والأجهزة، والتوكنات، والإشعارات، والموافقات.
        الطوابع بتضل بدون ما تدل على حدا. الطوابع والهدايا يلي ما استلمها بتضيع، فنبّهه قبل الحذف.
        نفس الرقم بيقدر يسجّل بعدين كحساب جديد فاضي.
      security: [{ customerToken: [] }]
      responses:
        '204': { description: انحذف }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /customer/me/profile:
    post:
      tags: [الزبون — الحساب]
      operationId: customerCompleteProfile
      summary: إكمال الاسم وتاريخ الميلاد
      description: مرة وحدة بعد أول دخول.
      security: [{ customerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, birthdate]
              properties:
                name: { type: string, minLength: 2, maxLength: 60 }
                birthdate: { type: string, format: date, description: بالماضي, example: '1998-05-20' }
      responses:
        '200': { $ref: '#/components/responses/CustomerData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: '`PROFILE_ALREADY_COMPLETED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`UNDER_AGE` (أقل من 13) · `VALIDATION_FAILED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: UNDER_AGE, message: Customers must be at least 13 years old., details: { min_age: 13 } }

  /customer/me/policy-consents:
    post:
      tags: [الزبون — الحساب]
      operationId: customerAcceptPolicy
      summary: الموافقة على إصدار جديد من سياسة الخصوصية
      description: لما يطلع إصدار جديد، كل المسارات «الجاهزة» بترجع `403 POLICY_CONSENT_REQUIRED` لحد ما يوافق.
      security: [{ customerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_version]
              properties:
                policy_version: { type: string, maxLength: 16, example: '1.2' }
      responses:
        '200': { $ref: '#/components/responses/CustomerData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: '`POLICY_VERSION_OUTDATED` مع `current_version` · `VALIDATION_FAILED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /customer/me/qr:
    get:
      tags: [الزبون — الحساب]
      operationId: customerQrSecret
      summary: سرّ توليد رمز QR
      description: |
        اطلبه مرة بعد الدخول وخزّنه بـ`expo-secure-store`. الرمز TOTP (RFC 6238) بـHMAC-SHA256 و8 أرقام،
        ومحتوى الـQR: `W1.{qr_id}.{code}`. الخادم بيقبل النافذة الحالية والسابقة بس. (جاهز)
      security: [{ customerToken: [] }]
      responses:
        '200':
          description: السر
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/QrSecret' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CustomerNotReady' }

  /customer/cards:
    get:
      tags: [الزبون — البطاقات]
      operationId: customerCards
      summary: بطاقاتي
      description: |
        كل البطاقات مرة وحدة بدون تصفح. الهدايا الجاهزة أول شي، بعدين حسب آخر طابع.
        بعد استلام هدية على بطاقة فعّالة: البطاقة بتضل بتقدّم 0 و`cycle.id: null`.
        بعد استلام هدية على بطاقة موقوفة: البطاقة بتختفي. (جاهز)
      security: [{ customerToken: [] }]
      responses:
        '200':
          description: البطاقات
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerCard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CustomerNotReady' }

  /customer/cards/{card_id}:
    get:
      tags: [الزبون — البطاقات]
      operationId: customerCard
      summary: تفاصيل بطاقة
      description: نفس حقول عنصر القائمة، ومعها طوابع الدورة الحالية (الأقدم أول) وعنوان المحل. (جاهز)
      security: [{ customerToken: [] }]
      parameters:
        - { name: card_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: البطاقة
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CustomerCardDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CustomerNotReady' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customer/directory:
    get:
      tags: [الزبون — دليل المحلات]
      operationId: customerGetDirectory
      summary: دليل المحلات كاملاً
      description: |
        كل المحلات الظاهرة دفعة وحدة، لأنو البحث والفلترة على الموبايل. بيظهر المحل يلي حالته TRIAL أو ACTIVE أو GRACE
        وعنده بطاقة فعّالة. ابعت `If-None-Match` بقيمة `ETag` السابقة، فبيرجع `304` إذا ما تغيّر شي. (جاهز)
      security: [{ customerToken: [] }]
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: الدليل
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DirectoryMerchant' }
        '304': { description: ما تغيّر شي }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CustomerNotReady' }

  /customer/shop-contacts:
    get:
      tags: [الزبون — دليل المحلات]
      operationId: customerListShopContacts
      summary: المحلات المشتركة مع عناوينها وأرقام التواصل
      description: |
        كل محل حالته TRIAL أو ACTIVE أو GRACE، حتى لو ما عنده بطاقة فعّالة، مرتب بالاسم. مو جزء من العقد.
        `contact_phone` هو الرقم يلي المحل اختار ينشره، ورقم التسجيل ما بيطلع. فيه `ETag` و`304` متل الدليل.
      security: [{ customerToken: [] }]
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: المحلات
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ShopContact' }
        '304': { description: ما تغيّر شي }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CustomerNotReady' }

  /customer/merchants/{merchant_id}:
    get:
      tags: [الزبون — دليل المحلات]
      operationId: customerGetMerchant
      summary: صفحة المحل
      description: |
        بطاقات المحل الفعّالة بس. المحل يلي مو بالدليل (منتهي مثلاً) بيفتح بس إذا الزبون إلو دورة عنده، ومع `cards` فاضية.
        غير هيك `404`. (جاهز)
      security: [{ customerToken: [] }]
      parameters:
        - { name: merchant_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: الصفحة
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MerchantPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CustomerNotReady' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customer/merchants/{merchant_id}/mute:
    parameters:
      - { name: merchant_id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [الزبون — البطاقات]
      operationId: customerMuteMerchant
      summary: إيقاف عروض هالمحل
      description: |
        بيوقف حملات هالمحل بس. إشعارات الطوابع والهدايا والتهنئة بتضل توصل. التكرار ما بيغيّر شي،
        وبيبيّن بـ`merchant_muted` بـ«بطاقاتي». (جاهز)
      security: [{ customerToken: [] }]
      responses:
        '204': { description: انوقفت }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CustomerNotReady' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [الزبون — البطاقات]
      operationId: customerUnmuteMerchant
      summary: إرجاع عروض هالمحل
      security: [{ customerToken: [] }]
      responses:
        '204': { description: رجعت }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CustomerNotReady' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customer/notifications:
    get:
      tags: [الزبون — الإشعارات والأجهزة]
      operationId: customerNotifications
      summary: صندوق الإشعارات
      description: الأحدث أول، بالمؤشر. الإشعارات هلق بالصندوق داخل التطبيق بس. (جاهز)
      security: [{ customerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CustomerNotReady' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /customer/notifications/{id}/read:
    post:
      tags: [الزبون — الإشعارات والأجهزة]
      operationId: customerReadNotification
      summary: تعليم إشعار كمقروء
      security: [{ customerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '204': { description: انعلّم }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CustomerNotReady' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customer/notifications/read-all:
    post:
      tags: [الزبون — الإشعارات والأجهزة]
      operationId: customerReadAllNotifications
      summary: تعليم الكل كمقروء
      security: [{ customerToken: [] }]
      responses:
        '204': { description: انعلّموا }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CustomerNotReady' }

  /customer/devices:
    put:
      tags: [الزبون — الإشعارات والأجهزة]
      operationId: customerRegisterDevice
      summary: تسجيل رمز FCM للجهاز
      description: بعد الدخول وكل ما يتغيّر. إذا الرمز كان لحساب تاني بينتقل لهالحساب.
      security: [{ customerToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/Device' }
      responses:
        '204': { description: انسجّل }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /customer/devices/{token}:
    delete:
      tags: [الزبون — الإشعارات والأجهزة]
      operationId: customerRemoveDevice
      summary: إزالة رمز الجهاز
      description: عند الخروج. `204` حتى لو الرمز مو موجود.
      security: [{ customerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceToken'
      responses:
        '204': { description: انشال }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ─────────────────────────── تطبيق التاجر ───────────────────────────
  /merchant/me:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    get:
      tags: [التاجر — الحساب والتسجيل]
      operationId: merchantMe
      summary: حالة التاجر والاشتراك
      description: |
        أول طلب عند فتح التطبيق. بيشتغل قبل التسجيل، وبيسجّل آخر دخول وبيحدّث البريد من توكن Clerk.
        `registration_step`: `business` ← `package` ← `pin` ← `done`.
      security: [{ clerkSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/MerchantMeData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/lookups:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    get:
      tags: [التاجر — الحساب والتسجيل]
      operationId: merchantLookups
      summary: القوائم والباقات والحدود
      description: |
        كل شي بتحتاجه نماذج التطبيق، مفتوح قبل التسجيل. ابني قواعد النماذج من `limits`.
        الأسعار وحدود الحملات والتجربة قيم مبدئية لحد ما تنحسم، وبتتعدّل من الإعدادات بدون تغيير بالتطبيق.
      security: [{ clerkSession: [] }]
      responses:
        '200':
          description: القوائم
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MerchantLookups' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/registration/business:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — الحساب والتسجيل]
      operationId: merchantRegisterBusiness
      summary: 'التسجيل 1: بيانات النشاط'
      description: مقبولة بس لما `registration_step = business`. مع الشعار ابعت الطلب `multipart/form-data`.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterBusinessInput' }
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/RegisterBusinessInput'
                - type: object
                  properties:
                    logo: { type: string, format: binary, description: JPEG أو PNG أو WebP لحد 2 MB }
      responses:
        '201':
          description: '`registration_step: "package"` و`subscription: null`'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MerchantMe' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/RegistrationStepMismatch' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/registration/package:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — الحساب والتسجيل]
      operationId: merchantSelectPackage
      summary: 'التسجيل 2: اختيار الباقة وبدء التجربة'
      description: |
        إذا البريد أخد تجربة قبل (حتى بحساب محذوف)، الطلب ما بينرفض: `trial_granted: false`
        و`subscription.status: "EXPIRED"`. بعد الـPIN بتوجّهه للدفع.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package_id]
              properties:
                package_id: { type: integer }
      responses:
        '200':
          description: '`registration_step: "pin"`'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/MerchantMe'
                      - type: object
                        required: [trial_granted]
                        properties:
                          trial_granted: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/RegistrationStepMismatch' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/registration/pin:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — الحساب والتسجيل]
      operationId: merchantRegisterPin
      summary: 'التسجيل 3: إنشاء الـPIN'
      description: فيها بيكتمل التسجيل، وبترجع `pin_token` كمان حتى ما ينطلب الـPIN فوراً.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { $ref: '#/components/schemas/Pin' }
      responses:
        '200':
          description: اكتمل التسجيل
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [me, pin]
                    properties:
                      me: { $ref: '#/components/schemas/MerchantMe' }
                      pin: { $ref: '#/components/schemas/PinToken' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/RegistrationStepMismatch' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/pin/unlock:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — الـPIN]
      operationId: merchantUnlockPin
      summary: فتح التبويبات المحمية
      description: |
        ابعت `pin_token` بـ`X-Pin-Token` مع التبويبات المحمية، وخزّنه بالذاكرة بس. صالح `pin_unlock_hours` ساعة.
        5 محاولات غلط ورا بعض بتقفل 15 دقيقة، والـPIN الصح بيصفّر العداد.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { $ref: '#/components/schemas/Pin' }
      responses:
        '200': { $ref: '#/components/responses/PinTokenData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RegistrationIncomplete' }
        '422': { $ref: '#/components/responses/PinInvalid' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }
        '429': { $ref: '#/components/responses/PinLocked' }

  /merchant/pin:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    put:
      tags: [التاجر — الـPIN]
      operationId: merchantChangePin
      summary: تغيير الـPIN
      description: كل `pin_token` قديم على كل الأجهزة بيوقف، وهالجهاز بياخد واحد جديد. الرمز الحالي الغلط بيتحسب من محاولات القفل.
      security: [{ clerkSession: [], pinToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_pin, new_pin]
              properties:
                current_pin: { $ref: '#/components/schemas/Pin' }
                new_pin: { $ref: '#/components/schemas/Pin' }
      responses:
        '200': { $ref: '#/components/responses/PinTokenData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '422': { $ref: '#/components/responses/PinInvalid' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }
        '429': { $ref: '#/components/responses/PinLocked' }

  /merchant/pin/reset:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — الـPIN]
      operationId: merchantResetPin
      summary: إعادة ضبط الـPIN بعد دخول حديث
      description: |
        لصاحب المحل يلي نسي الـPIN: `signOut()` ثم `signIn` ثم هالطلب **خلال 5 دقائق** من الدخول.
        الكاشير الفايت على جهاز المحل ما بيقدر.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_pin]
              properties:
                new_pin: { $ref: '#/components/schemas/Pin' }
      responses:
        '200': { $ref: '#/components/responses/PinTokenData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`PIN_RESET_REQUIRES_RECENT_LOGIN` · `REGISTRATION_INCOMPLETE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: PIN_RESET_REQUIRES_RECENT_LOGIN, message: Sign in again to reset the PIN., details: { max_age_seconds: 300 } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/cards:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    get:
      tags: [التاجر — البطاقات]
      operationId: merchantCards
      summary: بطاقات المحل
      description: بدون تصفح، والفعّالة أول شي. **بدون PIN** لأن شاشة المسح بتستعمله بـ`?status=active`.
      security: [{ clerkSession: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CardStatus' }
      responses:
        '200':
          description: البطاقات
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MerchantCard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RegistrationIncomplete' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }
    post:
      tags: [التاجر — البطاقات]
      operationId: merchantPublishCard
      summary: نشر بطاقة
      description: '**ما بتتعدّل بعد النشر، وما في مسار تعديل.** البطاقات الموقوفة ما بتنحسب من حد الباقة.'
      security: [{ clerkSession: [], pinToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, stamps_required, reward_description, icon_id]
              properties:
                name: { type: string, minLength: 2, maxLength: 60 }
                stamps_required: { type: integer, minimum: 3, maximum: 10, description: بين `limits.card_stamps_min` و`card_stamps_max` }
                reward_description: { type: string, minLength: 2, maxLength: 120 }
                terms: { type: [string, 'null'], maxLength: 500 }
                icon_id: { type: integer, description: من `lookups.icons` }
      responses:
        '201': { $ref: '#/components/responses/MerchantCardData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '422':
          description: '`CARDS_LIMIT_REACHED` · `MERCHANT_STATUS_BLOCKS_ACTION` (`action: cards`) · `VALIDATION_FAILED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                CARDS_LIMIT_REACHED:
                  value: { error: { code: CARDS_LIMIT_REACHED, message: The package allows no more active cards., details: { cards_limit: 2 } } }
                MERCHANT_STATUS_BLOCKS_ACTION:
                  value: { error: { code: MERCHANT_STATUS_BLOCKS_ACTION, message: The subscription does not allow new cards now., details: { status: EXPIRED, action: cards } } }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/cards/{card_id}/suspend:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — البطاقات]
      operationId: merchantSuspendCard
      summary: إيقاف بطاقة نهائياً
      description: |
        ما في رجعة. الزبائن الحاليين بيكمّلوا دوراتهم وبيستلموا هداياهم، وما في مشتركين جدد ولا دورات جديدة.
        التكرار بيرجّع البطاقة متل ما هي.
      security: [{ clerkSession: [], pinToken: [] }]
      parameters:
        - { name: card_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/MerchantCardData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/scan/resolve:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — المسح والطوابع]
      operationId: merchantResolveScan
      summary: معاينة ما قبل التأكيد
      description: |
        بعد مسح الرمز أو كتابة الرقم. **ما بتكتب شي بقاعدة البيانات.** بترجع `scan_token` صالح **3 دقائق**.
        ابعت `qr` أو `phone`، واحد منهم بس. الزبون المعلّق ما بينعمل هون، بينعمل عند تأكيد الطابع.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_id]
              properties:
                card_id: { type: integer, description: البطاقة المختارة (فعّالة أو موقوفة) }
                qr: { type: string, maxLength: 64, example: W1.Q1Pa9zblIBzE.19687500, description: المحتوى الخام من الكاميرا }
                phone: { $ref: '#/components/schemas/Phone' }
              oneOf:
                - required: [qr]
                - required: [phone]
      responses:
        '200':
          description: المعاينة
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ScanPreview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RegistrationIncomplete' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`QR_INVALID` · `QR_EXPIRED` · `VALIDATION_FAILED` (لا `qr` ولا `phone`، أو التنين سوا)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/stamps:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — المسح والطوابع]
      operationId: merchantAddStamp
      summary: تأكيد إضافة طابع
      description: |
        **طابع واحد بكل طلب.** الخادم بيعيد فحص كل القواعد لحظة التأكيد. الرقم الجديد بيصير هون زبون معلّق.
        الزبون المسجّل بيوصله إشعار بالطابع، وإشعار «هديتك جاهزة!» إذا اكتملت البطاقة.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scan_token, client_uuid]
              properties:
                scan_token: { type: string, description: من المعاينة }
                client_uuid: { type: string, format: uuid, description: ولّده مرة وحدة لكل ضغطة «تأكيد»، وأعد استعماله نفسه إذا أعدت المحاولة }
      responses:
        '201':
          description: طابع جديد
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StampResult' }
        '200':
          description: نفس الطلب انبعت قبل بنفس `client_uuid`، وهي النتيجة الأصلية. ما بينضاف طابع تاني.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StampResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RegistrationIncomplete' }
        '422':
          description: '`SCAN_TOKEN_EXPIRED` · `STAMP_INTERVAL` · `REWARD_READY_REDEEM_FIRST` · `CARD_SUSPENDED` · `MERCHANT_STATUS_BLOCKS_ACTION` · `VALIDATION_FAILED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                STAMP_INTERVAL:
                  value:
                    error:
                      code: STAMP_INTERVAL
                      message: Stamp interval not elapsed.
                      details: { last_stamp_at: '2026-09-29T15:00:52Z', next_allowed_at: '2026-09-29T16:00:52Z', minutes_since_last: 0, minutes_remaining: 60 }
                REWARD_READY_REDEEM_FIRST:
                  value: { error: { code: REWARD_READY_REDEEM_FIRST, message: The card is complete; hand over the reward first., details: { cycle_id: 17 } } }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/redemptions:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — المسح والطوابع]
      operationId: merchantRedeemReward
      summary: تأكيد تسليم الهدية
      description: |
        ذرّية: إذا ضغط جهازين سوا، واحد بس بينجح. مسموح بكل حالات الاشتراك، حتى المنتهي.
        ممكن بنفس زيارة الطابع الأخير وبنفس `scan_token`. الزبون بيوصله إشعار `reward_redeemed`.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scan_token, cycle_id]
              properties:
                scan_token: { type: string, description: من معاينة **مسح رمز** (`method = qr`) }
                cycle_id: { type: integer, description: '`cycle.id` من المعاينة، أو `cycle_id` من `other_ready_rewards`' }
      responses:
        '200':
          description: انسلّمت
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RedemptionResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RegistrationIncomplete' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`REWARD_ALREADY_REDEEMED`: جهاز تاني سلّمها للتو'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: REWARD_ALREADY_REDEEMED, message: This reward was just handed over., details: { cycle_id: 17, redeemed_at: '2026-09-29T15:00:52Z' } }
        '422':
          description: '`REDEEM_REQUIRES_QR` · `NO_REWARD_READY` · `SCAN_TOKEN_EXPIRED` · `VALIDATION_FAILED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/customers/birthdays-today:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    get:
      tags: [التاجر — أعياد الميلاد]
      operationId: merchantBirthdaysToday
      summary: أعياد ميلاد اليوم
      description: |
        الزبائن المسجّلين يلي عيد ميلادهم اليوم بتوقيت دمشق، ومن زبائن المحل (إلهم دورة على أي بطاقة عنده،
        حتى لو استلموا هديتها). **بدون سنة الميلاد.** مواليد 29 شباط بيطلعوا بـ28 شباط بالسنين غير الكبيسة.
      security: [{ clerkSession: [], pinToken: [] }]
      responses:
        '200':
          description: القائمة، مرتبة بالاسم
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BirthdayCustomer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/customers/{customer_id}/birthday-greeting:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — أعياد الميلاد]
      operationId: merchantSendBirthdayGreeting
      summary: إرسال تهنئة عيد ميلاد
      description: |
        الزبون بيوصله إشعار `birthday_greeting`، **حتى لو موقّف عروض المحل أو كل العروض.**
        مرة وحدة باليوم لكل زبون، وما بتنحسب من حد الحملات الأسبوعي.
      security: [{ clerkSession: [], pinToken: [] }]
      parameters:
        - { name: customer_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 300, description: نص التاجر، بدون روابط }
                gift: { type: [string, 'null'], maxLength: 60, description: هدية مع التهنئة، بدون روابط }
      responses:
        '201':
          description: انبعتت
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BirthdayGreeting' }
        '200':
          description: انبعتت تهنئة اليوم من قبل. بترجع التهنئة الأولى وما بينبعت شي جديد.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BirthdayGreeting' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`BIRTHDAY_NOT_TODAY` · `CAMPAIGN_CONTAINS_LINK` · `MERCHANT_STATUS_BLOCKS_ACTION` (`action: campaigns`) · `VALIDATION_FAILED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                BIRTHDAY_NOT_TODAY:
                  value: { error: { code: BIRTHDAY_NOT_TODAY, message: It is not this customer’s birthday today. } }
                CAMPAIGN_CONTAINS_LINK:
                  value: { error: { code: CAMPAIGN_CONTAINS_LINK, message: Links are not allowed in greetings., details: { field: message } } }
                MERCHANT_STATUS_BLOCKS_ACTION:
                  value: { error: { code: MERCHANT_STATUS_BLOCKS_ACTION, message: The subscription does not allow greetings now., details: { status: EXPIRED, action: campaigns } } }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/stats:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    get:
      tags: [التاجر — الإحصاءات والزبائن]
      operationId: merchantGetStats
      summary: الإحصاءات
      description: المجموع، ولكل بطاقة، وسلسلة يومية. الطوابع الملغاة ما بتنحسب، والأيام بتوقيت دمشق والأسبوع من السبت.
      security: [{ clerkSession: [], pinToken: [] }]
      parameters:
        - { name: card_id, in: query, required: false, schema: { type: integer } }
        - { name: days, in: query, required: false, schema: { type: integer, enum: [7, 30], default: 7 } }
      responses:
        '200':
          description: الإحصاءات
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MerchantStats' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/customers:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    get:
      tags: [التاجر — الإحصاءات والزبائن]
      operationId: merchantListCustomers
      summary: زبائن المحل
      description: كل زبون إلو دورة بالمحل (حتى المعلّق)، الأحدث نشاطاً بهالمحل أول. البحث بالاسم بس.
      security: [{ clerkSession: [], pinToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: q, in: query, required: false, schema: { type: string, minLength: 2, maxLength: 50 } }
      responses:
        '200':
          description: صفحة من الزبائن
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MerchantCustomer' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/profile:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    patch:
      tags: [التاجر — ملف المحل]
      operationId: merchantUpdateProfile
      summary: تعديل الهاتف والعنوان واسم المالك
      description: اسم النشاط ونوعه والمحافظة ما بيتعدّلوا من التطبيق. ابعت الحقول يلي بدك تغيّرها بس.
      security: [{ clerkSession: [], pinToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                owner_name: { type: string, minLength: 2, maxLength: 80 }
                phone: { $ref: '#/components/schemas/Phone' }
                address: { type: [string, 'null'], maxLength: 255, description: '`null` بيمسح العنوان' }
                contact_phone: { type: [string, 'null'], description: 'رقم التواصل يلي بيشوفه كل الزبائن: موبايل أو أرضي، وبيرجع `+963…`. `null` بيخبّيه', example: 011 222 3344 }
      responses:
        '200': { $ref: '#/components/responses/MerchantProfileData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/profile/logo:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — ملف المحل]
      operationId: merchantUploadLogo
      summary: تغيير الشعار
      description: '`POST` لأنو PHP ما بيقرأ ملفات بـ`PATCH`. الشعار القديم بينمسح.'
      security: [{ clerkSession: [], pinToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, format: binary, description: JPEG أو PNG أو WebP لحد 2 MB }
      responses:
        '200': { $ref: '#/components/responses/MerchantProfileData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/campaigns:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    get:
      tags: [التاجر — الحملات]
      operationId: merchantListCampaigns
      summary: الحملات المرسلة وعدّاد الأسبوع
      description: الأحدث أول، بالمؤشر. `meta` فيها كمان عدّاد الأسبوع بنفس أسماء `usage`.
      security: [{ clerkSession: [], pinToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحة من الحملات
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Campaign' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/CursorMeta'
                      - type: object
                        required: [campaigns_used_this_week, weekly_campaigns_limit, campaigns_resets_at]
                        properties:
                          campaigns_used_this_week: { type: integer }
                          weekly_campaigns_limit: { type: integer }
                          campaigns_resets_at: { $ref: '#/components/schemas/DateTime' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }
    post:
      tags: [التاجر — الحملات]
      operationId: merchantSendCampaign
      summary: إرسال حملة
      description: |
        نص بس. المستلمون: كل زبون مسجّل إلو دورة على أي بطاقة بالمحل (حتى لو مستلمة)، إلا يلي موقّف العروض كلها
        أو عروض هالمحل. الإرسال بالخلفية، والرد بيرجع فوراً مع `recipients_count`.
        الحد: `weekly_campaigns_limit` تبع الباقة، والأسبوع من السبت للجمعة بتوقيت دمشق.
      security: [{ clerkSession: [], pinToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string, minLength: 1, maxLength: 60, description: لحد `limits.campaign_title_max` }
                body: { type: string, minLength: 1, maxLength: 300, description: لحد `limits.campaign_body_max` }
      responses:
        '201':
          description: انبعتت
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '422':
          description: '`CAMPAIGN_WEEKLY_LIMIT_REACHED` · `CAMPAIGN_CONTAINS_LINK` · `MERCHANT_STATUS_BLOCKS_ACTION` (`action: campaigns`) · `VALIDATION_FAILED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                CAMPAIGN_WEEKLY_LIMIT_REACHED:
                  value: { error: { code: CAMPAIGN_WEEKLY_LIMIT_REACHED, message: "This week's campaigns are used up.", details: { weekly_limit: 1, resets_at: '2026-10-09T21:00:00Z' } } }
                CAMPAIGN_CONTAINS_LINK:
                  value: { error: { code: CAMPAIGN_CONTAINS_LINK, message: Links are not allowed in campaigns., details: { field: title } } }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/subscription:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    get:
      tags: [التاجر — الاشتراك والدفع]
      operationId: merchantGetSubscription
      summary: الاشتراك وسجل الفترات
      description: |
        نفس `subscription` يلي بـ`me`، ومعها `periods` الأحدث أول (حتى التجديد يلي لسا ما بلّش).
        `current_period` هي الفترة الشغّالة هلق وبتحدد الباقة، و`days_remaining` بيعدّ لآخر الاشتراك كله.
      security: [{ clerkSession: [], pinToken: [] }]
      responses:
        '200':
          description: الاشتراك
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Subscription'
                      - type: object
                        required: [periods]
                        properties:
                          periods:
                            type: array
                            items: { $ref: '#/components/schemas/SubscriptionPeriod' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/payments:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    get:
      tags: [التاجر — الاشتراك والدفع]
      operationId: merchantListPayments
      summary: سجل الدفعات
      description: الأحدث أول، بالمؤشر.
      security: [{ clerkSession: [], pinToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحة من الدفعات
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }
    post:
      tags: [التاجر — الاشتراك والدفع]
      operationId: merchantSubmitPayment
      summary: رفع إثبات دفع
      description: |
        الخادم بينسخ السعر بالدولار وسعر الصرف والمبلغ بالليرة لحظة الرفع، وما بيقرأ أي مبلغ من الطلب.
        دفعة معلّقة وحدة لكل تاجر. **التخفيض:** إذا حد الباقة الجديدة أقل من البطاقات الفعّالة، لازم `keep_card_ids`،
        والباقي بيتوقف لما تبلّش الفترة الجديدة.
      security: [{ clerkSession: [], pinToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package_id, duration_months, method, proof]
              properties:
                package_id: { type: integer }
                duration_months: { type: integer, enum: [1, 3, 12] }
                method: { $ref: '#/components/schemas/PaymentMethod' }
                reference: { type: string, maxLength: 100 }
                proof: { type: string, format: binary, description: JPEG أو PNG أو WebP لحد 5 MB }
                'keep_card_ids[]':
                  type: array
                  items: { type: integer }
                  description: للتخفيض بس، لحد حد الباقة الجديدة
      responses:
        '201':
          description: بطابور المراجعة
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PinRequired' }
        '409':
          description: '`PAYMENT_ALREADY_PENDING` مع `payment_id`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: { code: PAYMENT_ALREADY_PENDING, message: A payment is already waiting for review., details: { payment_id: 1 } } }
        '422':
          description: '`PRICE_NOT_AVAILABLE` · `KEEP_CARDS_REQUIRED` · `MERCHANT_STATUS_BLOCKS_ACTION` (`action: payments`) · `VALIDATION_FAILED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                KEEP_CARDS_REQUIRED:
                  value: { error: { code: KEEP_CARDS_REQUIRED, message: Choose which cards stay active on the smaller package., details: { cards_limit: 1, active_cards: 2 } } }
                PRICE_NOT_AVAILABLE:
                  value: { error: { code: PRICE_NOT_AVAILABLE, message: This package has no price for this duration. } }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/notifications:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    get:
      tags: [التاجر — الإشعارات والأجهزة]
      operationId: merchantNotifications
      summary: صندوق إشعارات التاجر
      description: |
        بنفس شكل وتصفح ونفس push إشعارات الزبون. فيها `birthdays_today` (كل يوم 9 الصبح بتوقيت دمشق)، وإشعارات
        الاشتراك والدفع: `trial_ending` · `subscription_ending` · `grace_started` · `subscription_expired` · `payment_approved` · `payment_rejected`.
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RegistrationIncomplete' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — الإشعارات والأجهزة]
      operationId: merchantReadNotification
      summary: تعليم إشعار كمقروء
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '204': { description: انعلّم }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RegistrationIncomplete' }
        '404': { $ref: '#/components/responses/NotFound' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/notifications/read-all:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    post:
      tags: [التاجر — الإشعارات والأجهزة]
      operationId: merchantReadAllNotifications
      summary: تعليم الكل كمقروء
      security: [{ clerkSession: [] }]
      responses:
        '204': { description: انعلّموا }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RegistrationIncomplete' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/devices:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    put:
      tags: [التاجر — الإشعارات والأجهزة]
      operationId: merchantRegisterDevice
      summary: تسجيل رمز FCM للجهاز
      security: [{ clerkSession: [] }]
      requestBody: { $ref: '#/components/requestBodies/Device' }
      responses:
        '204': { description: انسجّل }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RegistrationIncomplete' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  /merchant/devices/{token}:
    parameters:
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/AppPlatform'
    delete:
      tags: [التاجر — الإشعارات والأجهزة]
      operationId: merchantRemoveDevice
      summary: إزالة رمز الجهاز
      description: التاجر بيبعته عند الخروج من Clerk. `204` حتى لو الرمز مو موجود.
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceToken'
      responses:
        '204': { description: انشال }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/RegistrationIncomplete' }
        '426': { $ref: '#/components/responses/AppVersionUnsupported' }

  # ─────────────────────────── لوحة الإدارة ───────────────────────────
  /admin/auth/me:
    get:
      tags: [الإدارة]
      operationId: adminMe
      summary: الحساب والدور والصلاحيات
      description: |
        بأول دخول لصاحب البريد، الحساب بينربط بحساب Clerk تلقائياً. اللوحة بتستعمل `permissions` بس
        لتخبّي الشاشات والأزرار، والخادم بيفحص الصلاحية على كل طلب.
      security: [{ clerkSession: [] }]
      responses:
        '200':
          description: الحساب
          content:
            application/json:
              schema:
                type: object
                required: [data, permissions]
                properties:
                  data: { $ref: '#/components/schemas/AdminUser' }
                  permissions:
                    type: array
                    items: { $ref: '#/components/schemas/AdminPermission' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/admin-users:
    get:
      tags: [الإدارة]
      operationId: adminListAdminUsers
      summary: حسابات الإدارة
      description: الفعّالة أول، مرتبة بالاسم. الصلاحية `manage-admin-accounts`.
      security: [{ clerkSession: [] }]
      responses:
        '200':
          description: الحسابات
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [الإدارة]
      operationId: adminCreateAdminUser
      summary: إضافة حساب إدارة
      description: '`linked: false` لحد ما يفوت صاحب البريد على اللوحة بـClerk بنفس البريد. الصلاحية `manage-admin-accounts`.'
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255, description: فريد، بدون فرق بالأحرف الكبيرة والصغيرة }
                role: { $ref: '#/components/schemas/AdminRole' }
      responses:
        '201': { $ref: '#/components/responses/AdminUserData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/admin-users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [الإدارة]
      operationId: adminUpdateAdminUser
      summary: تعديل حساب إدارة
      description: |
        أي حقل من الحقول. `email` بس **قبل الربط** (بعده `prohibits`). ما حدا بيغيّر دوره أو بيعطّل حسابه
        بنفسه: `VALIDATION_FAILED` مع `fields.admin_user: ["invalid"]`. الصلاحية `manage-admin-accounts`.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
                role: { $ref: '#/components/schemas/AdminRole' }
                is_active: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/AdminUserData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [الإدارة]
      operationId: adminDeactivateAdminUser
      summary: تعطيل حساب إدارة
      description: |
        بيعطّل الحساب (`is_active: false`) وما بيحذفه، حتى يضل سجل التدقيق يدل على مين عمل شو.
        بيرجع يتفعّل بـ`PATCH` مع `is_active: true`. الصلاحية `manage-admin-accounts`.
      security: [{ clerkSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminUserData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/stamps/{id}/cancel:
    post:
      tags: [الإدارة]
      operationId: adminCancelStamp
      summary: إلغاء طابع غلط
      description: |
        الطابع ما بينحذف، بينعلّم ملغى. إذا كان هو يلي كمّل البطاقة، الدورة بترجع `COLLECTING`.
        العملية بتنكتب بسجل التدقيق، والتكرار بيرجّعه متل ما هو. الصلاحية `cancel-stamps`.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200':
          description: انلغى
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CancelledStamp' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`REWARD_ALREADY_REDEEMED`: ممنوع بعد تسليم الهدية'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/packages:
    get:
      tags: [الإدارة — الباقات والإعدادات]
      operationId: adminListPackages
      summary: الباقات مع مصفوفة الأسعار
      description: كل الباقات حتى المعطّلة. الصلاحية `manage-packages` (Super Admin).
      security: [{ clerkSession: [] }]
      responses:
        '200':
          description: الباقات
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminPackage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [الإدارة — الباقات والإعدادات]
      operationId: adminCreatePackage
      summary: إضافة باقة
      description: بتطلع فوراً بـ`GET /merchant/lookups` إذا فعّالة. بتنكتب بسجل التدقيق.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PackageInput'
                - type: object
                  required: [name, cards_limit, weekly_campaigns_limit, prices]
      responses:
        '201': { $ref: '#/components/responses/AdminPackageData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/packages/{id}:
    patch:
      tags: [الإدارة — الباقات والإعدادات]
      operationId: adminUpdatePackage
      summary: تعديل باقة أو أسعارها
      description: |
        أي حقل. بـ`prices` كل مدة بتنبعت بتتعدّل، و`price_usd: null` بيشيلها، والباقي ما بيتغيّر.
        ما في حذف: `is_active: false`. تغيير السعر للدفعات الجاية بس، وتغيير الحدود فوري لكل التجار على الباقة.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackageInput' }
      responses:
        '200': { $ref: '#/components/responses/AdminPackageData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/settings/billing:
    get:
      tags: [الإدارة — الباقات والإعدادات]
      operationId: adminGetBillingSettings
      summary: إعدادات الدفع والتجربة
      description: الصلاحية `manage-settings` (Super Admin).
      security: [{ clerkSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/BillingSettingsData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [الإدارة — الباقات والإعدادات]
      operationId: adminUpdateBillingSettings
      summary: تعديل إعدادات الدفع والتجربة
      description: ابعت الحقول يلي بدك تغيّرها بس. بتنكتب بسجل التدقيق.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exchange_rate_syp: { type: number, minimum: 1 }
                syriatel_cash_number: { type: [string, 'null'], maxLength: 30 }
                bank_transfer_details: { type: [string, 'null'], maxLength: 1000 }
                payment_review_sla_hours: { type: integer, minimum: 1, maximum: 168 }
                trial_days: { type: integer, minimum: 1, maximum: 90 }
                grace_days: { type: integer, minimum: 0, maximum: 30 }
      responses:
        '200': { $ref: '#/components/responses/BillingSettingsData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/payments:
    get:
      tags: [الإدارة — مراجعة الدفعات]
      operationId: adminListPayments
      summary: طابور المراجعة
      description: |
        `PENDING` (الافتراضي) الأقدم أول، والباقي الأحدث أول. الصلاحية `review-payments` (مراجع المدفوعات بس).
        الصورة مو الدليل: طابق وصول المبلغ مع الحساب قبل القبول.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحة من الدفعات
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminPayment' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payments/{id}:
    get:
      tags: [الإدارة — مراجعة الدفعات]
      operationId: adminGetPayment
      summary: تفاصيل دفعة
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/AdminPaymentData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/payments/{id}/approve:
    post:
      tags: [الإدارة — مراجعة الدفعات]
      operationId: adminApprovePayment
      summary: قبول دفعة
      description: |
        بيعمل فترة مدفوعة: من تاريخ الانتهاء القديم إذا الاشتراك شغّال أو بالمهلة، ومن اليوم إذا منتهي، والترقية فوراً
        وبتخلص وين كان رح يخلص التجديد. التاجر بيرجع `ACTIVE` وبيوصله `payment_approved`.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/AdminPaymentData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PaymentNotPending' }

  /admin/payments/{id}/reject:
    post:
      tags: [الإدارة — مراجعة الدفعات]
      operationId: adminRejectPayment
      summary: رفض دفعة
      description: التاجر بيوصله `payment_rejected` بالسبب، وبيقدر يرفع دفعة جديدة.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/PaymentRejectionReason' }
      responses:
        '200': { $ref: '#/components/responses/AdminPaymentData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PaymentNotPending' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/merchants/{id}/trial-extension:
    post:
      tags: [الإدارة — الباقات والإعدادات]
      operationId: adminExtendTrial
      summary: تمديد التجربة المجانية
      description: |
        لتاجر ما دفع أبداً. الأيام بتنضاف لنهاية التجربة، أو لليوم إذا خلصت (فالمنتهي بيرجع `TRIAL`).
        الصلاحية `grant-extensions` (Super Admin)، والسبب بينكتب بسجل التدقيق.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days, reason]
              properties:
                days: { type: integer, minimum: 1, maximum: 90 }
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200':
          description: الاشتراك بعد التمديد
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`TRIAL_NOT_EXTENDABLE` مع `reason`: `paid` · `no_trial` · `status`. أو `VALIDATION_FAILED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: { code: TRIAL_NOT_EXTENDABLE, message: This shop has paid; only a trial can be extended., details: { reason: paid } } }

  /admin/merchants:
    get:
      tags: [الإدارة — التجار]
      operationId: adminListMerchants
      summary: قائمة التجار
      description: 'الأحدث تسجيلاً أول، والتاجر يلي لسا عم يسجّل معهم (`status: null`). الصلاحية `view-merchants-and-customers`.'
      security: [{ clerkSession: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/MerchantStatus' } }
        - { name: governorate_id, in: query, required: false, schema: { type: integer } }
        - { name: business_type_id, in: query, required: false, schema: { type: integer } }
        - { name: package_id, in: query, required: false, description: الباقة يلي التاجر عليها هلق, schema: { type: integer } }
        - { name: trial_ending, in: query, required: false, description: تجربته بتخلص خلال 7 أيام, schema: { type: string, enum: [week] } }
        - { name: q, in: query, required: false, description: جزء من اسم النشاط أو البريد، أو رقم الهاتف كامل, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: registration_step, in: query, required: false, schema: { type: string, enum: [package, pin, done] } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: صفحة من التجار
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminMerchant' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/merchants/{id}:
    get:
      tags: [الإدارة — التجار]
      operationId: adminGetMerchant
      summary: صفحة التاجر
      description: الاشتراك، والفترات، وآخر 10 دفعات، والبطاقات، والإحصاءات من أول ما فتح المحل.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/AdminMerchantDetailData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [الإدارة — التجار]
      operationId: adminUpdateMerchantIdentity
      summary: تصحيح اسم النشاط أو نوعه
      description: الصلاحية `edit-business-identity`. السبب إلزامي، والتغيير بينكتب بسجل التدقيق.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                business_name: { type: string, minLength: 2, maxLength: 80 }
                business_type_id: { type: integer }
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/AdminMerchantDetailData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/merchants/{id}/suspend:
    post:
      tags: [الإدارة — التجار]
      operationId: adminSuspendMerchant
      summary: إيقاف التاجر
      description: |
        لاحتيال أو مخالفة. ما في طوابع ولا زبائن جداد ولا حملات، وبيختفي من الدليل، بس تسليم الهدايا بيضل شغّال.
        الصلاحية `suspend-merchants`.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/SubscriptionData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MerchantStatusConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/merchants/{id}/reactivate:
    post:
      tags: [الإدارة — التجار]
      operationId: adminReactivateMerchant
      summary: إعادة تفعيل التاجر
      description: |
        من `SUSPENDED` بس. الحالة بترجع للحالة يلي بتحددها التواريخ هلق، فإذا الاشتراك خلص وقت الإيقاف بيرجع `EXPIRED`.
        الصلاحية `suspend-merchants`.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/SubscriptionData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MerchantStatusConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/cards/{id}/suspend:
    post:
      tags: [الإدارة — التجار]
      operationId: adminSuspendCard
      summary: إيقاف بطاقة محتواها مو مناسب
      description: متل ما التاجر بيوقفها، والهدايا المستحقة بتنسلّم عادي. إذا كانت موقوفة ما بيصير شي. الصلاحية `suspend-merchants`.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200':
          description: البطاقة
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, merchant_id, name, status, suspended_at]
                    properties:
                      id: { type: integer }
                      merchant_id: { type: integer }
                      name: { type: string }
                      status: { $ref: '#/components/schemas/CardStatus' }
                      suspended_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/customers:
    get:
      tags: [الإدارة — الزبائن]
      operationId: adminFindCustomer
      summary: البحث عن زبون بالرقم كامل
      description: ما في تصفّح. بيرجّع زبون واحد أو قائمة فاضية، والرقم مخفي. الصلاحية `view-merchants-and-customers`.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: phone, in: query, required: true, schema: { $ref: '#/components/schemas/Phone' } }
      responses:
        '200':
          description: النتيجة
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 1
                    items: { $ref: '#/components/schemas/AdminCustomer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/customers/{id}:
    get:
      tags: [الإدارة — الزبائن]
      operationId: adminGetCustomer
      summary: صفحة الزبون
      description: مع كل دوراته، الأحدث نشاطاً أول. الزبون المحذوف بيرجع `404`.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/AdminCustomerData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [الإدارة — الزبائن]
      operationId: adminUpdateCustomerBirthdate
      summary: تصحيح تاريخ الميلاد
      description: بعد التأكد من هوية الزبون. الصلاحية `edit-customer-birthdate`، والتغيير بينكتب بسجل التدقيق.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [birthdate, reason]
              properties:
                birthdate: { type: string, format: date }
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/AdminCustomerData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`UNDER_AGE` أو `VALIDATION_FAILED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/customers/{id}/reveal-phone:
    post:
      tags: [الإدارة — الزبائن]
      operationId: adminRevealCustomerPhone
      summary: عرض الرقم كاملاً
      description: كل ضغطة بتنكتب بسجل التدقيق (`customer.phone_revealed`). الصلاحية `reveal-customer-phone`.
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: الرقم
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [phone]
                    properties:
                      phone: { $ref: '#/components/schemas/Phone' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/card-cycles/{id}:
    get:
      tags: [الإدارة — الزبائن]
      operationId: adminGetCardCycle
      summary: الدورة مع طوابعها
